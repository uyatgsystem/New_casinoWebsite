<footer
  class="bg-[#0A0E1F] text-white relative mt-4"
  *ngIf="
    (!isDashboardRoute() || !isScreenWidthLessThan800()) &&
    !isTreasurePickRoute()
  "
  id="footer"
>
  <div class="relative bg-[#161819] h-20 w-full">
    <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
    <div
      class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-[#2A1C1B] to-[#8A7960]"
    ></div>

    <div
      class="absolute left-1/2 -translate-x-1/2 -top-8 flex flex-col items-center justify-center gap-2"
    >
      <!-- GRADIENT BORDER -->
      <div
        class="bg-gradient-to-t from-[#242019] to-[#8A7960] p-[1px] pb-0"
        style="clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%)"
      >
        <!-- INNER CONTENT -->
        <div
          class="bg-[#161819] px-10 flex items-center justify-center shadow-md"
          style="clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%)"
        >
          <img
            src="https://cmaxv2images2.pages.dev/assets/logos/footerLogo.png"
            alt="Center Logo"
            class="h-20 object-contain"
            style="transform: scale(1.75); transform-origin: center"
          />
        </div>
      </div>
      <div class="text-xs sm:text-sm text-[#9196A5] font-medium">
        CasinoMaxs. All rights reserved.
      </div>
    </div>

    <div
      class="absolute inset-x-0 top-0 flex items-center justify-end max-w-[90rem] mx-auto px-6 mt-10 md:mt-6"
    >
      <div class="flex items-center space-x-1 md:space-x-3">
        <a
          href="https://www.facebook.com/profile.php?id=61585037884179&_rdc=1&_rdr#"
          target="_blank"
          class="w-8 h-8 rounded bg-transparent flex items-center justify-center transition"
        >
          <i class="fab fa-facebook-f hover:text-[#FEBB55]"></i>
        </a>

        <a
          href="https://www.instagram.com/casinomaxs/"
          target="_blank"
          class="w-8 h-8 rounded bg-transparent flex items-center justify-center transition"
        >
          <i class="fab fa-instagram hover:text-[#FEBB55]"></i>
        </a>
      </div>
    </div>
  </div>
</footer>

<!-- navbar on  small screens  -->
<!-- Mobile Footer -->
<nav
  *ngIf="
    isDashboardRoute() && isScreenWidthLessThan800() && !isTreasurePickRoute()
  "
  class="fixed bottom-1 left-1/2 -translate-x-1/2 w-[97%] max-w-md h-[60px] bg-[#161819]/95 backdrop-blur-xl border border-transparent rounded-2xl flex items-center justify-between px-2 z-[999] shadow-[0_8px_30px_rgba(0,0,0,0.6)]"
>
  <!-- Gradient Border Layer -->
  <div
    class="absolute inset-0 rounded-2xl p-[1px] bg-gradient-to-r from-[#8A7960]/40 via-[#FFD700]/20 to-[#8A7960]/40 pointer-events-none"
  >
    <div class="w-full h-full bg-[#161819]/95 rounded-2xl"></div>
  </div>

  <!-- Home -->
  <a
    routerLink="/dashboard/home"
    (click)="changeRoute('/dashboard/home')"
    routerLinkActive="active-tab"
    class="footer-item"
  >
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
      />
    </svg>
    <span>Home</span>
  </a>

  <!-- Wallet -->
  <a
    routerLink="/dashboard/wallet"
    routerLinkActive="active-tab"
    #rlaWallet="routerLinkActive"
    (click)="changeRoute('/dashboard/wallet')"
    [routerLinkActiveOptions]="{ exact: true }"
    [class.active-tab]="rlaWallet.isActive && !isChatVisible"
    class="footer-item"
  >
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M3 7a2 2 0 012-2h11a2 2 0 012 2v2h1a2 2 0 012 2v2a2 2 0 01-2 2h-1v2a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm16 4h-4a1 1 0 000 2h4v-2z"
      />
    </svg>
    <span>Wallet</span>
  </a>

  <!-- Games -->
  <a
    routerLink="/dashboard/account"
    routerLinkActive="active-tab"
    #rlaSpinner="routerLinkActive"
    (click)="changeRoute('/dashboard/account')"
    [routerLinkActiveOptions]="{ exact: true }"
    [class.active-tab]="rlaSpinner.isActive && !isChatVisible"
    class="footer-item"
  >
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"
      />
    </svg>
    <span>Games</span>
  </a>

  <!-- Chat -->
  <a
    (click)="showChatComponent()"
    [class.active-tab]="isChatVisible"
    class="footer-item relative"
  >
    <!-- Notification -->
    <div
      *ngIf="unreadCounts > 0"
      class="absolute top-[2px] right-[18px] w-4 h-4 text-[9px] flex items-center justify-center rounded-full bg-[#FE911A] text-black animate-pulse shadow-md"
    >
      {{ unreadCounts > 99 ? "99+" : unreadCounts }}
    </div>

    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
      ></path>
    </svg>

    <span>Chat</span>
  </a>
</nav>
