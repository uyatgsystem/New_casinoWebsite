<!-- ================= FUTURISTIC CYBER-DOCK SIDEBAR ================= -->
<div
  *ngIf="!isTreasurePickRoute()"
  class="flex-col items-center flex-shrink-0 w-[240px] h-[calc(100vh-70px)] overflow-y-auto text-gray-300 transition-all duration-300 ease-in-out fixed z-[996] top-[70px] flex shadow-[20px_0_60px_rgba(0,0,0,0.95)] custom-scrollbar bg-[#010204]/95 backdrop-blur-3xl border-r border-[#00F5D4]/40"
  [class.hidden]="!isSidebarOpen"
  [ngClass]="{ mobile: isMobile }"
>
  <div
    class="absolute inset-0 pointer-events-none opacity-10"
    [innerHTML]="grainBackdrop"
  ></div>

  <div class="w-full flex flex-col pt-8 pb-6 px-4 relative z-10 space-y-6">
    <!-- Mobile User Hologram Badge -->
    <div class="block lg:hidden w-full">
      <div
        class="flex items-center gap-3 p-3 rounded-2xl bg-black/90 border border-[#00F5D4]/50 shadow-[0_0_15px_rgba(0,245,212,0.2)]"
      >
        <div class="relative flex-shrink-0">
          <img
            [src]="profileImage"
            alt="Profile"
            class="h-10 w-10 rounded-xl border border-[#00F5D4] object-cover"
          />
        </div>
        <div class="flex items-center w-full overflow-hidden">
          <div class="flex flex-col truncate">
            <span class="text-xs font-black text-white truncate">{{
              userName || "Operative"
            }}</span>
            <span
              class="text-[9px] text-[#00F5D4] font-mono tracking-wider uppercase font-bold"
              >VIP Status</span
            >
          </div>
          <button
            (click)="showComletePorfile()"
            class="ml-auto text-[#00F5D4] p-1.5 rounded-xl bg-[#00F5D4]/15 border border-[#00F5D4]/40 cursor-pointer shadow-[0_0_10px_rgba(0,245,212,0.2)]"
          >
            <fa-icon [icon]="faUserEdit"></fa-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- 1. Cybernetic Quick Switcher Pod -->
    <div
      class="hidden lg:flex flex-col w-full bg-black/90 p-1.5 rounded-2xl border border-[#00F5D4]/40 shadow-inner gap-1"
    >
      <button
        type="button"
        (click)="selectQuickTab('games', '/dashboard/home', 'games-scroll-id')"
        class="w-full py-2.5 px-3 rounded-xl text-xs font-black tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer border"
        [ngClass]="
          activeQuickTab === 'games'
            ? 'bg-gradient-to-b from-[#0c101d] to-[#050811] text-[#00F5D4] shadow-[0_0_15px_rgba(0,245,212,0.35)] border-[#00F5D4]'
            : 'text-gray-300 hover:text-white bg-black/60 border-[rgba(0,245,212,0.3)] hover:border-[rgba(0,245,212,0.6)] hover:bg-[#00F5D4]/10'
        "
      >
        <span>🎮</span> GAMES MATRIX
      </button>
      <button
        type="button"
        (click)="
          selectQuickTab('instant', '/dashboard/home', 'quick-scrolling-id')
        "
        class="w-full py-2.5 px-3 rounded-xl text-xs font-black tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer border"
        [ngClass]="
          activeQuickTab === 'instant'
            ? 'bg-gradient-to-b from-[#0c101d] to-[#050811] text-[#00F5D4] shadow-[0_0_15px_rgba(0,245,212,0.35)] border-[#00F5D4]'
            : 'text-gray-300 hover:text-white bg-black/60 border-[rgba(0,245,212,0.3)] hover:border-[rgba(0,245,212,0.6)] hover:bg-[#00F5D4]/10'
        "
      >
        <span>⚡</span> INSTANT ARENA
      </button>
    </div>

    <!-- 2. Neon Referral Command Card -->
    <div
      class="relative w-full bg-gradient-to-b from-black/90 to-neutral-950 p-3.5 rounded-2xl border border-[rgba(0,245,212,0.35)] shadow-[0_4px_20px_rgba(0,0,0,0.8)] group hover:border-[#00F5D4] transition"
    >
      <div class="flex items-center justify-between mb-1.5">
        <span
          class="text-[9px] text-[#00F5D4] font-mono tracking-widest font-black uppercase"
          >SECURE REF-NODE</span
        >
        <span class="w-2 h-2 rounded-full bg-[#00F5D4] animate-pulse"></span>
      </div>
      <div class="flex items-center justify-between gap-2">
        <span
          class="text-white text-xs font-mono font-black truncate bg-black/80 px-2 py-1 rounded-lg border border-[rgba(0,245,212,0.2)] flex-1"
          >{{ referralCode }}</span
        >
        <div class="relative">
          <div
            *ngIf="showCopiedTooltip"
            class="absolute -top-7 left-1/2 -translate-x-1/2 bg-[#00F5D4] text-black text-[8px] font-black px-2 py-0.5 rounded shadow z-20 animate-bounce"
          >
            COPIED!
          </div>
          <button
            (click)="copyReferralCode()"
            class="w-8 h-8 rounded-xl bg-[#00F5D4]/25 border border-[#00F5D4] flex items-center justify-center text-[#00F5D4] hover:bg-[#00F5D4] hover:text-black hover:shadow-[0_0_15px_rgba(0,245,212,0.5)] transition cursor-pointer"
          >
            <svg
              class="w-3.5 h-3.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
            >
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path
                d="M5 14H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. Navigation HUD Grid -->
    <div class="flex flex-col space-y-2 w-full">
      <span
        class="text-[9px] text-gray-500 font-mono font-bold uppercase tracking-widest px-1"
        >NAVIGATION HUD</span
      >

      <a
        routerLink="/dashboard/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebarMobile()"
        class="cyber-nav-node"
      >
        <div class="node-icon"><img src="/home.png" alt="" /></div>
        <div class="node-text">
          <span class="title">Home Hub</span>
          <span class="sub">Dashboard Portal</span>
        </div>
      </a>

      <a
        routerLink="/dashboard/wallet"
        routerLinkActive="active"
        (click)="closeSidebarMobile()"
        class="cyber-nav-node"
      >
        <div class="node-icon">
          <img
            src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Wallet.png"
            alt=""
          />
        </div>
        <div class="node-text">
          <span class="title">Vault & Wallet</span>
          <span class="sub">Assets & Funds</span>
        </div>
      </a>

      <a
        routerLink="/dashboard/account"
        routerLinkActive="active"
        (click)="closeSidebarMobile()"
        class="cyber-nav-node"
      >
        <div class="node-icon">
          <img
            src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/GameAccount.png"
            alt=""
          />
        </div>
        <div class="node-text">
          <span class="title">Game Account</span>
          <span class="sub">Profile Records</span>
        </div>
      </a>

      <a
        routerLink="/dashboard/spinner"
        routerLinkActive="active"
        (click)="closeSidebarMobile()"
        class="cyber-nav-node"
      >
        <div class="node-icon">
          <img
            src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/spin.png"
            alt=""
          />
        </div>
        <div class="node-text">
          <span class="title">Lucky Spin</span>
          <span class="sub">Daily Rewards</span>
        </div>
      </a>

      <a
        routerLink="/dashboard/guides"
        routerLinkActive="active"
        (click)="closeSidebarMobile()"
        class="cyber-nav-node"
      >
        <div class="node-icon">
          <img
            src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Redeem.png"
            alt=""
          />
        </div>
        <div class="node-text">
          <span class="title">User Guide</span>
          <span class="sub">Rules & Help</span>
        </div>
      </a>

      <a
        *ngIf="isMobile == true"
        (click)="redirecttoTermsConditions()"
        class="cyber-nav-node"
      >
        <div class="node-icon">
          <img
            src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Lotteries.png"
            class="h-4 object-contain"
            alt=""
          />
        </div>
        <div class="node-text">
          <span class="title">Terms & Conditions</span>
          <span class="sub">Policies</span>
        </div>
      </a>

      <a
        *ngIf="isMobile == true"
        (click)="showLogoutModal()"
        class="cyber-nav-node text-red-400 hover:text-red-300"
      >
        <div
          class="node-icon bg-red-500/15 border-red-500/40 shadow-[0_0_10px_rgba(239,68,68,0.2)]"
        >
          <img
            src="https://cmax.pages.dev/assets/icons/sidebar-icons/logout.png"
            class="h-4 object-contain"
            alt=""
          />
        </div>
        <div class="node-text">
          <span class="title text-red-400">Disconnect</span>
          <span class="sub text-red-500/60">Terminate Session</span>
        </div>
      </a>
    </div>

    <!-- Bottom Mascot / Visual Graphic -->
    <div class="mt-auto pt-4 flex justify-center">
      <img
        src="https://cmaxv2images2.pages.dev/assets/banners/sidebar-characters.png"
        alt="Characters"
        class="w-full max-w-[140px] object-contain opacity-80 drop-shadow-[0_0_15px_rgba(0,245,212,0.3)]"
        onerror="this.style.display = 'none'"
      />
    </div>
  </div>
</div>

<app-logoutmodel
  [isOpen]="isLogoutModalOpen"
  [profileImage]="profileImage"
  (onCancel)="closeLogoutModal()"
  (onConfirm)="logout()"
>
</app-logoutmodel>
