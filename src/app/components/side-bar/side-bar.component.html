<!-- Component Start -->
<div *ngIf="!isTreasurePickRoute()"
  class="booderr flex-col items-center flex-shrink-0 w-[250px] h-screen overflow-y-auto text-gray-400 transition-all duration-300 ease-in-out fixed z-[997] top-0 flex shadow-2xl custom-scrollbar"
  [class.hidden]="!isSidebarOpen" [ngClass]="{ mobile: isMobile }">
  <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
  
  <div class="w-full flex flex-col pt-24 pb-6 px-3 mobile-overlay custom-border-r">
    
    <!-- Profile (mobile only) -->
    <div class="block lg:hidden mb-4 px-1">
      <div class="flex items-center gap-3 w-full p-2 rounded-2xl bg-black/40 border border-[#bfa97a]/20">
        <div class="relative inline-block flex-shrink-0">
          <img [src]="profileImage" alt="Profile"
            class="h-10 w-10 rounded-full border-2 border-[#bfa97a]/40 object-cover shadow-md" />
          <img *ngIf="profileLevel" [src]="getLevelImage(profileLevel)" alt="Level Badge"
            class="absolute top-0 right-0 translate-x-1/4 -translate-y-1/4 h-5 w-5" />
        </div>
        <div class="flex items-center w-full overflow-hidden">
          <span class="text-xs font-bold text-white truncate">
            {{ userName | slice:0:8 }}{{ userName?.length > 8 ? '...' : '' }}
          </span>
          <button (click)="showComletePorfile()" class="ml-auto text-[#FE8006] hover:scale-110 transition p-1">
            <fa-icon [icon]="faUserEdit"></fa-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Switcher: Games First (Left), Instant Second (Right) -->
    <div class="hidden lg:flex items-center justify-between w-full max-w-[220px] mx-auto mb-4 p-1 bg-black/70 backdrop-blur-md border border-[#C3B089]/30 rounded-2xl shadow-inner relative">
      
      <!-- Games Tab (Left) -->
      <div (click)="selectQuickTab('games', '/dashboard/home', 'games-scroll-id')"
        class="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl cursor-pointer transition-all duration-300 group"
        [ngClass]="{
          'bg-gradient-to-r from-[#DD256A]/20 to-[#F3A630]/20 border border-[#DD256A]/40 shadow-sm': activeQuickTab === 'games',
          'border border-transparent hover:bg-white/5': activeQuickTab !== 'games'
        }">
        <span class="text-xs font-semibold tracking-wide"
          [ngClass]="activeQuickTab === 'games' ? 'text-pink-400 font-extrabold' : 'text-gray-400 group-hover:text-white'">
          🎮 Games
        </span>
      </div>

      <!-- Instant Tab (Right) -->
      <div (click)="selectQuickTab('instant', '/dashboard/home', 'quick-scrolling-id')"
        class="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl cursor-pointer transition-all duration-300 group"
        [ngClass]="{
          'bg-gradient-to-r from-[#FC552D]/20 to-[#F3A630]/20 border border-[#F3A630]/40 shadow-sm': activeQuickTab === 'instant',
          'border border-transparent hover:bg-white/5': activeQuickTab !== 'instant'
        }">
        <span class="text-xs font-extrabold tracking-wide"
          [ngClass]="activeQuickTab === 'instant' ? 'text-amber-400' : 'text-gray-400 group-hover:text-white'">
          ⚡ Instant
        </span>
      </div>

    </div>

    <!-- Referral Card Component -->
    <div class="flex items-center justify-between gap-2 w-full max-w-[220px] mx-auto mb-4 px-3 py-2 bg-black/60 backdrop-blur-md border border-[#C3B089]/40 rounded-2xl shadow-lg relative">
      <div class="flex items-center gap-2 overflow-hidden">
        <div class="w-7 h-7 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-[#F3A630] flex-shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
        </div>
        <div class="flex flex-col overflow-hidden">
          <span class="text-[8px] text-[#bfa97a] uppercase tracking-wider font-bold">Referral Code</span>
          <span class="text-white text-xs font-mono font-bold truncate">{{ referralCode }}</span>
        </div>
      </div>

      <div class="relative">
        <div *ngIf="showCopiedTooltip" class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#fe8912] text-black text-[9px] font-bold px-2 py-[2px] rounded-md whitespace-nowrap shadow-xl z-20 animate-bounce">
          Copied ✓
        </div>
        <button (click)="copyReferralCode()" class="flex items-center justify-center w-7 h-7 rounded-xl bg-gradient-to-br from-[#F3A630]/25 to-[#F3A630]/5 border border-[#F3A630]/40 hover:border-[#F3A630] hover:scale-105 active:scale-95 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 text-[#F3A630]">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 14H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Menu Items Section -->
    <div class="relative flex flex-col items-center w-full max-w-[220px] bg-[#0c0d10]/90 backdrop-blur-xl mx-auto border border-[#C3B089]/30 rounded-3xl p-1.5 mb-4 shadow-2xl overflow-hidden">
      <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
      
      <div class="relative z-10 w-full gap-1.5 flex flex-col">
        <a class="sidebar-item" routerLink="/dashboard/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebarMobile()">
          <img src="/home.png" alt="icon" />
          <span class="text-xs font-medium">Home</span>
        </a>

        <a class="sidebar-item" routerLink="/dashboard/wallet" routerLinkActive="active" (click)="closeSidebarMobile()">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Wallet.png" alt="icon" />
          <span class="text-xs font-medium">Wallet</span>
        </a>

        <a class="sidebar-item" routerLink="/dashboard/account" routerLinkActive="active" (click)="closeSidebarMobile()">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/GameAccount.png" alt="icon" />
          <span class="text-xs font-medium">Game Account</span>
        </a>

        <a class="sidebar-item" routerLink="/dashboard/spinner" routerLinkActive="active" (click)="closeSidebarMobile()">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/spin.png" alt="icon" />
          <span class="text-xs font-medium">Spin</span>
        </a>

        <a class="sidebar-item" routerLink="/dashboard/guides" routerLinkActive="active" (click)="closeSidebarMobile()">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Redeem.png" alt="icon" />
          <span class="text-xs font-medium">Guide</span>
        </a>

        <a *ngIf="isMobile == true" (click)="redirecttoTermsConditions()" class="sidebar-item hello">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Lotteries.png" class="h-4 object-contain" alt="icon" />
          <span class="text-xs font-medium">Terms & Condition</span>
        </a>

        <a *ngIf="isMobile == true" (click)="showLogoutModal()" class="sidebar-item hello text-red-400 hover:text-red-300">
          <img src="https://cmax.pages.dev/assets/icons/sidebar-icons/logout.png" class="h-4 object-contain" alt="icon" />
          <span class="text-xs font-medium">Logout</span>
        </a>
      </div>
    </div>
    
    <!-- Optional Bottom Characters Image -->
    <div class="mt-auto px-2 flex justify-center pb-4">
      <img src="https://cmaxv2images2.pages.dev/assets/banners/sidebar-characters.png" alt="Characters" class="w-full max-w-[160px] object-contain opacity-90 drop-shadow-lg" onerror="this.style.display='none'" />
    </div>

  </div>
</div>

<app-logoutmodel [isOpen]="isLogoutModalOpen" [profileImage]="profileImage" (onCancel)="closeLogoutModal()"
  (onConfirm)="logout()">
</app-logoutmodel>
