<!-- Component Start -->
<div *ngIf="!isTreasurePickRoute()"
  class="booderr flex-col items-center flex-shrink-0 w-[250px] h-screen overflow-hidden text-gray-400 bg-[#161819] md:gap-12 transition-all duration-300 ease-in-out fixed z-[997] top-0 flex"
  [class.hidden]="!isSidebarOpen" [ngClass]="{ mobile: isMobile }">
  <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
  <div class="w-full flex flex-col py-12 px-2 mobile-overlay custom-border-r">
    <!-- Profile (mobile only) -->
    <div class="block lg:hidden">
      <div class="flex items-center px-2 gap-3 w-full">

        <!-- FIXED wrapper -->
        <div class="relative inline-block flex-shrink-0">
          <!-- Profile Image -->
          <img [src]="profileImage" alt="Profile"
            class="h-11 w-11 min-w-[44px] min-h-[44px] rounded-full border-2 cursor-pointer object-cover" />

          <!-- Badge -->
          <img *ngIf="profileLevel" [src]="getLevelImage(profileLevel)" alt="Level Badge"
            class="absolute top-0 right-0 translate-x-1/4 -translate-y-1/4 h-6 w-6  shadow-md" />
        </div>

        <div class="flex items-center w-full">

          <span class="text-lg font-bold text-white">
            {{ userName | slice:0:8 }}{{ userName?.length > 8 ? '...' : '' }}
          </span>

          <button (click)="showComletePorfile()" class="ml-auto text-[#FE8006] transition hover:scale-110 mr-2">
            <fa-icon [icon]="faUserEdit"></fa-icon>
          </button>

        </div>

      </div>
    </div>

    <div class="flex flex-row items-center w-50 gap-4 mx-auto mt-3 mb-4">
      <!-- Instant BUTTON -->
      <div
        class="hidden lg:flex w-[75px] h-[85px] cursor-pointer rounded-[16px_3px] bg-gradient-to-b from-[#FC552D] to-[#F3A630] flex flex-col items-center pt-3"
        (click)="navigateAndScroll('/dashboard/home', 'quick-scrolling-id')">
        <span class="text-white font-semibold text-[16px] leading-[19px]">
          Instant
        </span>

        <img src="https://cmaxv2images2.pages.dev/assets/icons/quick.png"
          class="w-[62px] h-[35px] mt-2 object-contain" />
      </div>

      <!-- GAMES BUTTON -->
      <div
        class="hidden lg:flex w-[75px] h-[85px] cursor-pointer rounded-[16px_3px] bg-gradient-to-b from-[#5F3155] to-[#DD256A] flex flex-col items-center pt-3"
        (click)="navigateAndScroll('/dashboard/home', 'games-scroll-id')">
        <span class="text-white font-semibold text-[16px] leading-[19px]">
          Games
        </span>

        <img src="https://cmaxv2images2.pages.dev/assets/icons/games.png"
          class="w-[62px] h-[35px] mt-2 object-contain" />
      </div>
    </div>


    <div class="flex items-center justify-between gap-3 w-full max-w-[200px] mx-auto mb-2
         px-4 py-2
border border-[#C3B089] rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px]
         shadow-[0_0_25px_rgba(254,137,18,0.10)]">

      <!-- Left Content -->
      <div class="flex items-center gap-3 overflow-hidden">
        <!-- Code -->
        <div class="flex flex-col overflow-hidden">
          <span class="text-[8px] text-[#8f8f8f] uppercase tracking-[1.5px]">
            Referral Code
          </span>

          <span class="text-white text-sm font-semibold truncate tracking-wide">
            {{ referralCode }}
          </span>
        </div>
      </div>

      <!-- Copy Button -->
      <!-- Copy Button -->
      <div class="relative">

        <!-- Tooltip -->
        <div *ngIf="showCopiedTooltip" class="absolute -top-9 left-1/2 -translate-x-1/2
           bg-[#fe8912] text-black text-[10px] font-semibold
           px-2 py-[4px] rounded-md whitespace-nowrap
           shadow-lg z-20">
          Copied ✓
        </div>

        <button (click)="copyReferralCode()" class="group relative flex items-center justify-center
           w-[34px] h-[34px]
           rounded-lg
           bg-gradient-to-br from-[#F3A630]/20 to-[#F3A630]/5
           border border-[#F3A630]/25
           hover:border-[#F3A630]/60
           active:scale-95
           transition-all duration-200">

          <!-- SVG Copy Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="w-[15px] h-[15px]
             text-[#F3A630]
             opacity-90">

            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 14H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>

          </svg>
        </button>
      </div>
    </div>
    <!-- Menu Items -->
    <div
      class="relative flex flex-col items-center w-45 bg-[#0f0f0f]/80 mx-4 border border-[#C3B089] rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] mb-16 md:mb-0 md:mt-0 overflow-hidden">
      <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
      <!-- Content -->
      <div class="relative z-10 my-4 gap-3 flex flex-col">
        <a class="sidebar-item" routerLink="/dashboard/home" routerLinkActive="active" (click)="closeSidebarMobile()">
          <img src="/home.png" alt="icon" />
          <span>Home</span>
        </a>

        <a class="sidebar-item" routerLink="/dashboard/wallet" routerLinkActive="active" (click)="closeSidebarMobile()">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/Wallet.png" alt="icon" />
          <span class="text-sm">Wallet</span>
        </a>

        <a class="sidebar-item" routerLink="/dashboard/account" routerLinkActive="active"
          (click)="closeSidebarMobile()">
          <img src="https://cmaxv2images2.pages.dev/assets/icons/sidebar/GameAccount.png" alt="icon" />
