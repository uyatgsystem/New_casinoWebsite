<!-- ===== TOP BADGES BAR ===== -->
<div class="spin-top-bar">
  <div class="spin-top-bar__badge spin-top-bar__badge--fair">
    <span class="spin-top-bar__dot"></span>
    256-BIT PROVABLY FAIR RNG
  </div>
  <div class="spin-top-bar__badge spin-top-bar__badge--info" (click)="showGuide()">
    🎁 Next Free Spin: Make Deposit To Unlock More FreeSpin
  </div>
</div>

<!-- ===== MAIN WHEEL AREA ===== -->
<div class="spinner-container w-fit m-auto">
  <div class="outer-border">
    <div class="outer-gap">
      <div class="wheel-shell">
        <div class="wheel-ring">
          <div class="dot-circles">
            <div
              class="dot-circle"
              *ngFor="let seg of segments; let i = index"
              [style.--i]="i"
              [style.--count]="segments.length"
            ></div>
          </div>
          <div class="wheel-frame">
            <div class="wheel-container">
              <div
                class="wheel"
                [class.has-highlight]="highlightedIndex !== null"
                [style.--highlight-start]="highlightedIndex !== null ? highlightedIndex * segmentAngle + 'deg' : null"
                [style.--highlight-end]="highlightedIndex !== null ? (highlightedIndex + 1) * segmentAngle + 'deg' : null"
                [style.transform]="'rotate(' + rotation + 'deg)'"
              >
                <div class="outer-ring" [style.background]="wheelGradient">
                  <div
                    class="segment"
                    *ngFor="let segment of segments; let i = index"
                    [class.win]="i === highlightedIndex"
                    [style.--start-angle]="i * segmentAngle + 'deg'"
                    [style.--slice-angle]="segmentAngle"
                  >
                    <div class="segment-content" [style.transform]="'rotate(' + i * segmentAngle + 'deg)'">
                      <div
                        class="prize-group absolute left-2/4 top-[14px] flex flex-col items-center gap-1"
                        [class.prize-win]="i === highlightedIndex"
                      >
                        <ng-icon
                          class="text-2xl leading-none"
                          [name]="segment.icon"
                          [style.color]="getIconColor(i)"
                          style="filter: drop-shadow(0 0 4px rgba(255,255,255,0.35));"
                        ></ng-icon>
                        <span class="text-white text-lg font-bold">{{ segment.prize }}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Central Hub -->
              <div
                class="central-hub"
                role="button"
                tabindex="0"
                (click)="onCentralHubClick($event)"
                (keydown.enter)="onCentralHubClick($event)"
                (keydown.space)="onCentralHubClick($event)"
                [style.cursor]="isSpinning || !isBalanceSufficient || !isSpinAllowed ? 'not-allowed' : 'pointer'"
                [attr.aria-disabled]="isSpinning || !isBalanceSufficient || !isSpinAllowed ? true : null"
              >
                <div class="central-hub__disc">
                  <div class="central-hub__label" aria-hidden="false">
                    <span *ngIf="isSpinning" class="hub-text hub-text--spinning">...</span>
                    <span *ngIf="!isSpinning && isBalanceSufficient && isSpinAllowed" class="hub-text hub-text--ready">
                      <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                        <path d="M8 5v14l11-7z"/>
                      </svg>
                    </span>
                    <span *ngIf="!isSpinning && (!isBalanceSufficient || !isSpinAllowed)" class="hub-text hub-text--disabled">
                      <svg viewBox="0 0 24 24" fill="none" width="26" height="26" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                      </svg>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Spin Again Modal -->
      <div
        *ngIf="SpinAgainModal"
        class="fixed spinagian inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-[999]"
        (click)="CloseSpinAgainModal()"
      >
        <div
          class="bg-[#292d2e] border border-[#2CD97D]/40 rounded-3xl p-6 w-[32rem] modal slide-up shadow-[0_0_30px_rgba(44,217,125,0.2)]"
          (click)="$event.stopPropagation()"
        >
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-black text-white uppercase tracking-wider">Spin Again</h2>
            <button (click)="CloseSpinAgainModal()" class="text-slate-400 hover:text-[#2CD97D] transition">
              <fa-icon [icon]="crossicon"></fa-icon>
            </button>
          </div>
          <hr class="border-[#2CD97D]/20 mb-4" />
          <div class="mb-4 w-full text-center">
            <p class="text-md text-slate-300">
              Spin again for just
              <span class="text-[#2CD97D] font-black font-mono text-lg">$2</span>
              to win more!
            </p>
          </div>
          <div class="flex justify-center">
            <button
              type="submit"
              class="spin-btn py-3 px-8 rounded-xl bg-[linear-gradient(135deg,#2CD97D_0%,#06B6D4_50%,#FF9F1C_100%)] text-slate-950 font-black uppercase text-sm shadow-[0_4px_15px_rgba(44,217,125,0.3)] hover:brightness-110 active:scale-95 transition"
              (click)="paidSpin()"
            >
              Spin Now
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pointer Arrow -->
  <div class="wheel-pointer" [class.wobble]="isSpinning">
    <svg xmlns="http://www.w3.org/2000/svg" width="59" height="97" viewBox="0 0 59 97" fill="none">
      <path
        d="M32.2045 93.8627C31.083 98.0353 27.9171 98.0353 26.7955 93.8627L19.3304 51.8423C18.3104 48.0476 19.7755 40 22.0349 40L36.9651 40C39.2245 40 40.6896 48.0476 39.6696 51.8423L32.2045 93.8627Z"
        fill="#2CD97D"
      />
      <circle cx="29.4999" cy="29.4998" r="29.3201" transform="rotate(89.6477 29.4999 29.4998)" fill="#2CD97D"/>
      <circle cx="29.2251" cy="29.8445" r="16.4157" transform="rotate(89.6477 29.2251 29.8445)" fill="url(#paint0_linear_2779_1088)"/>
      <defs>
        <linearGradient id="paint0_linear_2779_1088" x1="29.2251" y1="13.4288" x2="29.2251" y2="46.2602" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2CD97D"/>
          <stop offset="100%" stop-color="#FF9F1C"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</div>

<!-- ===== CONTROLS SECTION ===== -->
<div class="spin-controls">

  <!-- Quick Bet Multiplier Buttons: MIN / 1/2 / 2X / MAX -->
  <div class="spin-bet-row">
    <button class="spin-bet-btn" (click)="spinAmount = '1'" [class.active]="spinAmount === '1'">MIN</button>
    <button class="spin-bet-btn" (click)="spinAmount = ('' + (parseFloat(spinAmount) / 2 || 2.5))" >1/2</button>
    <button class="spin-bet-btn" (click)="spinAmount = ('' + (parseFloat(spinAmount) * 2 || 10))">2X</button>
    <button class="spin-bet-btn" (click)="spinAmount = '30'" [class.active]="spinAmount === '30'">MAX</button>
  </div>

  <!-- Chip Amount Selector -->
  <div class="spin-chips-row">
    <button
      *ngFor="let amt of chipAmounts"
      class="spin-chip"
      [class.spin-chip--active]="spinAmount === ('' + amt)"
      (click)="spinAmount = '' + amt"
    >
      <span class="spin-chip__label">\${{ amt }}</span>
    </button>
  </div>

  <!-- Spin Action Button -->
  <button
    class="spin-action-btn"
    (click)="freeSpin()"
    [disabled]="isSpinning || !isBalanceSufficient || !isSpinAllowed"
    [class.spin-action-btn--disabled]="isSpinning || !isBalanceSufficient || !isSpinAllowed"
  >
    <span class="spin-action-btn__icon">🎯</span>
    <span>{{ isBalanceSufficient ? 'Spin Now!' : 'Insufficient Balance' }}</span>
  </button>

</div>
