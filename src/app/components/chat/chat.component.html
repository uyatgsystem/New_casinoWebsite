<div
  [class.chat-input-focused]="isInputFocused"
  class="chat-container pb-4 md:p-0 overflow-hidden"
>
  <div
    class="chat-window shadow-xl flex flex-col transition-all duration-500 ease-in-out border-[#C3B089] border rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px]"
    [class.chat-input-focused]="isInputFocused"
  >
    <div class="backdrop-image" [innerHTML]="backdropImage"></div>
    <!-- [ngClass]="{
      'chat-window-collapsed': !messages || messages.length === 0,
      'chat-window-expanded': messages && messages.length > 0,
    }"
    [class.chat-input-focused]="isInputFocused" -->
    <!-- Loader -->
    <div *ngIf="loading" class="loader">
      <div class="spinner"></div>
      Loading messages...
    </div>

    <!-- Header -->
    <div
      class="chat-header p-4 flex-shrink-0 rounded-t-2xl border-b border-[#C3B089]"
    >
      <div class="flex items-center justify-between w-full">
        <!-- Left Section: Logo and Title -->
        <div class="flex items-center gap-3">
          <!-- <div class="w-8 h-8 rounded-full flex items-center justify-center">
            <img
              src="https://cmax.pages.dev/assets/high_rollers_logo.png"
              alt="C_Max Logo"
              class="w-full h-full object-contain"
            />
          </div> -->
          <h1 class="text-white text-lg font-semibold">Customer Support</h1>
        </div>

        <!-- Right Section: Action Buttons -->
        <div class="flex items-center gap-2">
          <!-- Minimize Button -->
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center action-button minimize-button cursor-pointer"
            (click)="showHideChat()"
          >
            <fa-icon [icon]="Minimize" class="text-white text-sm"></fa-icon>
          </div>

          <!-- Close Button -->
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center action-button close-button cursor-pointer"
            (click)="showHideChat()"
          >
            <fa-icon [icon]="Close" class="text-white text-sm"></fa-icon>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Messages Section -->
    <div
      #chatBody
      (scroll)="onScroll($event)"
      class="chat-messages flex flex-col p-6 pb-0 chat-body"
      [ngClass]="{
        'overflow-y-auto': messages && messages.length > 0,
        'overflow-hidden': !messages || messages.length === 0,
      }"
    >
      <!-- No Messages Welcome Screen -->
      <div
        *ngIf="!messages || messages.length === 0"
        class="flex flex-col items-center justify-center h-full text-center welcome-screen"
      >
        <h1 class="text-white text-2xl md:text-3xl font-semibold mb-4">
          We are here for You
        </h1>
        <p class="text-gray-300 text-base md:text-lg max-w-md leading-relaxed">
          welcome to support. this chat will be monitored to ensure safety.
        </p>
      </div>

      <!-- Messages Display -->
      <div
        *ngFor="let message of messages"
        class="w-full flex my-1"
        [ngClass]="{
          'justify-end':
            message?.MessageFrom == 'Customer' ||
            message?.SenderId == getUserId(),
          'justify-start':
            message?.MessageFrom != 'Customer' ||
            message?.SenderId != getUserId(),
        }"
      >
        <!-- Customer Message (New Clean Design) -->
        <div
          *ngIf="
            message?.MessageType != 'UnEngaged' &&
            (message?.MessageFrom == 'Customer' ||
              message?.SenderId == getUserId())
          "
          class="max-w-[60%] min-w-[32%] md:min-w-[38%] flex flex-col items-end"
        >
          <!--
          Commented out for clean design - preserving logic for future use:
          Avatar and sender info section

          <div class="flex gap-1 sender-info w-full float-right flex-row-reverse">
            <span class="msg-sender">{{
              message?.MessageFrom == "customer" ||
              message?.SenderName == getUserName()
                ? message?.SenderName?.charAt(0)?.toUpperCase()
                : "C"
            }}</span>
            <small>
              @if (message?.MessageFrom == 'customer' || message?.SenderName ==
              getUserName()) {{{ message?.SenderName }}}@else{Customer
              Support}
            </small>
          </div>
          -->

          <!-- Message Bubble with Clean Design -->
          <div
            class="customer-message-bubble text-white rounded-xl px-2 py-3 shadow-lg break-words max-w-full relative overflow-hidden"
          >
            <!-- Image handling (preserved logic) -->
            <div
              *ngIf="message.ImageUrl"
              class="image-container relative mb-2 max-w-full mt-1"
            >
              <img
                [src]="message?.ImageUrl"
                alt="Selected Image"
                class="w-full max-w-sm h-auto rounded-md cursor-pointer hover:opacity-90 transition-opacity"
                (click)="openImageModal(message.ImageUrl)"
              />
            </div>

            <!-- Message Text -->
            <p
              style="
                line-height: normal;
                margin: 0;
                margin-bottom: 16px;
                word-wrap: break-word;
                word-break: break-all;
                overflow-wrap: break-word;
                white-space: pre-wrap;
                font-size: 14px;
              "
            >
              {{ message?.Message }}
            </p>

            <!-- Blue double tick inside message bubble -->
            <div class="w-max absolute right-[8px] bottom-[6px]">
              <span
                class="message-status w-full float-right justify-end flex-row-reverse"
              >
                <!-- Double tick seen (blue) -->
                <fa-icon
                  *ngIf="message.IsDelivered && message.IsSeen"
                  [icon]="CheckDouble"
                  class="text-blue-400 text-sm"
                  title="Seen"
                ></fa-icon>
                <!-- Double tick delivered (gray) -->
                <fa-icon
                  *ngIf="message.IsDelivered && !message.IsSeen"
                  [icon]="CheckDouble"
                  class="text-gray-400 text-sm"
                  title="Delivered"
                ></fa-icon>
                <!-- Single tick sent (gray) -->
                <fa-icon
                  *ngIf="!message.IsDelivered"
                  [icon]="Check"
                  class="text-gray-400 text-sm"
                  title="Sent"
                ></fa-icon>
              </span>
            </div>
          </div>

          <!-- Timestamp outside the bubble -->
          <span class="customer-timestamp">
            {{ message.Time | date: "hh:mm a" }}
          </span>

          <!--
          Commented out message status for clean design - preserving logic:

          <span class="message-status w-full float-right justify-end flex-row-reverse">
            <img
              *ngIf="message.IsDelivered && message.IsSeen"
              src="/Images/chat-icons/double-tick-seen.png"
              alt="tick"
            />
            <img
              *ngIf="message.IsDelivered && !message.IsSeen"
              src="/Images/chat-icons/double-tick-delivered.png"
              alt="tick"
            />
            <img
              *ngIf="!message.IsDelivered"
              src="/Images/chat-icons/single-tick.png"
              alt="tick"
            />
          </span>
          -->
        </div>

        <!-- Support/Agent Message (New Clean Design) -->
        <div
          *ngIf="
            message?.MessageType != 'UnEngaged' &&
            message?.MessageFrom != 'Customer' &&
            message?.SenderId != getUserId()
          "
          class="max-w-[60%] min-w-[32%] md:min-w-[38%] flex flex-col items-start"
        >
          <!--
          Commented out for clean design - preserving logic for future use:
          Avatar and sender info section

          <div class="flex gap-1 sender-info w-full justify-start float-left">
            <span class="msg-sender">C</span>
            <small>Customer Support</small>
          </div>
          -->

          <!-- Message Bubble with Clean Design -->
          <div
            class="support-message-bubble text-gray-800 rounded-xl px-2 py-3 shadow-lg break-words max-w-full overflow-hidden"
          >
            <!-- Image handling (preserved logic) -->
            <div
              *ngIf="message.ImageUrl"
              class="image-container relative mb-2 max-w-full mt-1"
            >
              <img
                [src]="message?.ImageUrl"
                alt="Selected Image"
                class="w-full max-w-sm h-auto rounded-md border border-gray-400 cursor-pointer hover:opacity-90 transition-opacity"
                (click)="openImageModal(message.ImageUrl)"
              />
            </div>

            <!-- Message Text -->
            <p
              style="
                line-height: normal;
                margin: 0;
                white-space: pre-wrap;
                word-wrap: break-word;
                word-break: break-all;
                overflow-wrap: break-word;
              "
            >
              {{ message?.Message }}
            </p>
          </div>

          <!-- Timestamp outside the bubble -->
          <span class="support-timestamp">
            {{ message.Time | date: "hh:mm a" }}
          </span>
        </div>
        <div *ngIf="message.MessageType == 'UnEngaged'" class="hell">
          <div
            class="text-gray-400 text-sm p-2 w-full text-center fixed bottom-4 left-1/2 transform -translate-x-1/2"
          >
            <p class>chat session has ended</p>
          </div>
        </div>
      </div>
      <!-- <ng-template #noChatFound>
      <div
        class="flex flex-col items-center h-[58dvh] justify-center text-white p-6 rounded-lg"
      >
        <div class="relative">
          <div
            class="absolute top-2 left-2 bg-teal-400 p-4 rounded-lg text-white"
          >
            <span class="flex space-x-1">
              <span class="w-2 h-2 bg-white rounded-full"></span>
              <span class="w-2 h-2 bg-white rounded-full"></span>
              <span class="w-2 h-2 bg-white rounded-full"></span>
            </span>
          </div>
          <div class="bg-teal-200 p-6 rounded-lg ml-6 mt-6"></div>
        </div>
        <h4 class="text-gray-300 mt-4">Start Conversation.</h4>
      </div>
    </ng-template> -->

      <!-- Display Selected in input Image -->
      <div
        *ngIf="imageURL"
        class="selected-image-preview -mb-2 w-48 ml-2 selected-image-shown"
      >
        <img
          [src]="imageURL"
          alt="Selected Image"
          class="w-full h-auto max-h-32 object-contain"
        />
        <button
          (click)="clearSelection()"
          class="absolute top-1 right-1 bg-gray-800 text-white rounded-full p-1 hover:bg-red-500 transition-colors z-10"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M18 6L6 18M6 6l12 12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <!-- Display Selected Image End-->

      <!-- Input Area -->

      <!-- Image Modal -->
      <div #imageModal class="modal" (click)="closeImageModal()">
        <span class="close" (click)="closeImageModal()">&times;</span>
        <img
          class="modal-content"
          [src]="selectedImageUrl"
          alt="Image Preview"
        />
        <a
          *ngIf="selectedImageUrl"
          [href]="selectedImageUrl"
          download="image.jpg"
          class="download-button"
        >
          <fa-icon [icon]="Download" class="text-2xl"></fa-icon>
        </a>
      </div>
      <!-- Input Area  End -->
    </div>
    <!-- Input Area -->
    <div class="chat-input p-3 sm:p-4 bg-transparent">
      <div class="flex gap-2 items-center">
        <div
          class="relative w-full flex items-center border-[#C3B089] border rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] min-h-[48px] sm:min-h-[52px]"
        >
          <!-- Left Plus Button -->
          <button
            (click)="toggleOptionsMenu()"
            class="mx-2 sm:left-3 flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10"
          >
            <svg
              width="26"
              height="26"
              class="sm:w-[34px] sm:h-[34px]"
              viewBox="0 0 34 34"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9.54627 23.688C8.46204 22.6037 7.91992 21.3074 7.91992 19.7989C7.91992 18.2904 8.46204 16.994 9.54627 15.9098L16.9709 8.48517C17.7487 7.70735 18.6915 7.31844 19.7993 7.31844C20.9071 7.31844 21.8499 7.70735 22.6277 8.48517C23.4056 9.26298 23.7945 10.2058 23.7945 11.3136C23.7945 12.4214 23.4056 13.3642 22.6277 14.142L15.9102 20.8595C15.4153 21.3545 14.826 21.602 14.1425 21.602C13.4589 21.602 12.8697 21.3545 12.3747 20.8595C11.8797 20.3646 11.6322 19.7753 11.6322 19.0918C11.6322 18.4082 11.8797 17.819 12.3747 17.324L19.0922 10.6065L20.1529 11.6671L13.4354 18.3847C13.235 18.585 13.1348 18.8207 13.1348 19.0918C13.1348 19.3628 13.235 19.5985 13.4354 19.7989C13.6357 19.9992 13.8714 20.0994 14.1425 20.0994C14.4135 20.0994 14.6492 19.9992 14.8496 19.7989L21.5671 13.0814C22.0621 12.5864 22.3095 11.9971 22.3095 11.3136C22.3095 10.6301 22.0621 10.0408 21.5671 9.54583C21.0721 9.05085 20.4829 8.80336 19.7993 8.80336C19.1158 8.80336 18.5265 9.05085 18.0315 9.54583L10.6069 16.9704C9.82911 17.7483 9.4402 18.6911 9.4402 19.7989C9.4402 20.9067 9.82911 21.8495 10.6069 22.6273C11.3847 23.4051 12.3276 23.794 13.4354 23.794C14.5432 23.794 15.486 23.4051 16.2638 22.6273L23.6884 15.2027L24.7491 16.2633L17.3244 23.688C16.2402 24.7722 14.9439 25.3143 13.4354 25.3143C11.9269 25.3143 10.6305 24.7722 9.54627 23.688Z"
                fill="#C3B089"
              />
            </svg>
          </button>

          <!-- Textarea -->
          <textarea
            (focus)="onInputFocus()"
            (blur)="onInputBlur()"
            (paste)="onPaste($event)"
            [(ngModel)]="newMessage"
            (keydown)="onTextareaKeydown($event)"
            (input)="adjustHeight($event)"
            placeholder="Write a message here..."
            rows="1"
            class="w-full text-sm sm:text-xs bg-transparent outline-none border-none text-white !placeholder-white focus:border-none focus:ring-0 resize-none py-2"
            style="min-height: 40px; line-height: 2.5; overflow-y: hidden"
          ></textarea>

          <!-- Send Button -->
          <button
            (click)="sendMessage($event)"
            class="right-2 mx-2 sm:right-3 flex items-center justify-center gap-1 sm:gap-2 px-3 sm:px-4 py-2 rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] text-black font-semibold text-xs sm:text-sm bg-[linear-gradient(180deg,#FEC866_0%,#FE8006_100%)]"
          >
            <span class="sm:inline">Send</span>
          </button>
        </div>

        <!-- Options Menu -->
        <div
          *ngIf="showOptionsMenu"
          class="absolute bottom-20 left-4 bg-[#2a271e] border border-[#C3B089] rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] shadow-lg z-10 w-40 p-2"
        >
          <!-- <button (click)="openCamera()"
            class="flex items-center gap-2 p-2 text-gray-400 hover:bg-[#303137] hover:text-white rounded-md w-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="currentColor"
              viewBox="0 0 512 512">
              <path
                d="M149.1 64.8L138.7 96 64 96C28.7 96 0 124.7 0 160L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64l-74.7 0L362.9 64.8C356.4 45.2 338.1 32 317.4 32L194.6 32c-20.7 0-39 13.2-45.5 32.8zM256 192a96 96 0 1 1 0 192 96 96 0 1 1 0-192z" />
            </svg>

            <span> Camera</span>
          </button> -->
          <!-- Camera View -->
          <div
            *ngIf="isCameraOpen"
            class="fixed inset-0 bg-gradient-to-br from-purple-600 to-purple-800bg-opacity-50 flex items-center justify-center"
          >
            <div class="bg-black p-4 rounded-lg">
              <video
                #videoElement
                autoplay
                playsinline
                [hidden]="showPreview"
              ></video>
              <canvas #canvasElement style="display: none"></canvas>

              <!-- Captured Image Preview -->
              <img
                *ngIf="showPreview"
                [src]="capturedImage"
                class="max-w-full h-auto"
              />

              <div class="flex justify-center gap-4 mt-4">
                <ng-container *ngIf="!showPreview">
                  <button
                    class="camera-btn text-white p-2 bg-[#303137] rounded-full"
                    (click)="capturePicture()"
                  >
                    <svg
                      class="h-6 w-6 text-purple-400"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z"
                      />
                    </svg>
                  </button>
                </ng-container>

                <ng-container *ngIf="showPreview">
                  <button
                    class="camera-btn p-2 bg-[#303137] rounded-full"
                    (click)="retakePhoto()"
                  >
                    <svg
                      class="h-6 w-6 text-purple-400"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
                      />
                    </svg>
                  </button>
                </ng-container>

                <button
                  class="bg-[#303137] p-2 bg-[#30313 rounded-full"
                  (click)="closeCamera()"
                >
                  <svg
                    class="h-6 w-6 text-purple-400"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M6 18 18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <!-- Camera View End -->

          <!-- Gallery Image Selection -->

          <button
            (click)="triggerFileInput(fileInput)"
            class="flex items-center gap-2 p-2 text-gray-400 hover:text-white rounded-md w-full transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-gray-400"
              fill="currentColor"
              viewBox="0 0 512 512"
            >
              <path
                d="M448 80c8.8 0 16 7.2 16 16l0 319.8-5-6.5-136-176c-4.5-5.9-11.6-9.3-19-9.3s-14.4 3.4-19 9.3L202 340.7l-30.5-42.7C167 291.7 159.8 288 152 288s-15 3.7-19.5 10.1l-80 112L48 416.3l0-.3L48 96c0-8.8 7.2-16 16-16l384 0zM64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zm80 192a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"
              />
            </svg>
            <span>Gallery</span>
          </button>
          <input
            (paste)="onPaste($event)"
            type="file"
            #fileInput
            accept="image/*"
            style="display: none"
            (change)="onFileSelected($event)"
          />
          <!-- Gallery Image Selection End -->
        </div>
      </div>
    </div>
  </div>
</div>
