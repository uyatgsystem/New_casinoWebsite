<div *ngIf="isLoading" class="spinhub-luxury-loader-overlay">
  <!-- Subtle Ambient Glows -->
  <div class="luxury-ambient-emerald" aria-hidden="true"></div>
  <div class="luxury-ambient-gold" aria-hidden="true"></div>

  <div class="luxury-loader-content">
    <!-- 3D VIP Casino Chip Stage -->
    <div class="chip-stage-3d">
      <!-- Ambient Orbit Rings -->
      <div class="orbital-ring ring-outer" aria-hidden="true"></div>
      <div class="orbital-ring ring-inner" aria-hidden="true"></div>

      <!-- Floating Suits -->
      <div class="floating-suits" aria-hidden="true">
        <span class="suit suit-spade">♠</span>
        <span class="suit suit-heart">♥</span>
        <span class="suit suit-diamond">♦</span>
        <span class="suit suit-club">♣</span>
      </div>

      <!-- 3D Spinning Golden Casino Chip -->
      <div class="vip-3d-chip">
        <div class="chip-face chip-front">
          <div class="chip-outer-rim">
            <div class="rim-teeth"></div>
          </div>
          <div class="chip-inner-core">
            <div class="sheen-sweep"></div>
            <img
              src="/logo.png"
              alt="Crown Spin"
              class="chip-brand-logo"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Luxury Typography & Progress -->
    <div class="loader-info">
      <div class="brand-title">
        <span class="brand-name">CROWN<span class="text-emerald">SPIN</span></span>
        <span class="vip-badge">VIP</span>
      </div>

      <div class="loading-status-text">
        <span>{{ statusMessage }}</span>
        <span class="loading-dots">
          <span>.</span><span>.</span><span>.</span>
        </span>
      </div>

      <!-- Sleek Neon Shimmer Progress Bar -->
      <div class="sleek-progress-track">
        <div class="sleek-progress-bar"></div>
      </div>
    </div>
  </div>
</div>
