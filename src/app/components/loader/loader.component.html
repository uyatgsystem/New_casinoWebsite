<div *ngIf="isLoading" class="spinhub-prime-loader-overlay">
  <div class="spinhub-prime-loader">
    <!-- Ambient Holographic Glow Aura -->
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Center Stage with Cybernetic Rings & Roulette Ball -->
    <div class="loader-stage">
      <!-- Outer Hexagon Matrix Shield -->
      <div class="ring hex-ring" aria-hidden="true"></div>

      <!-- Orbiting Lasers Track -->
      <div class="orbit-track track-1" aria-hidden="true">
        <div class="orbit-comet comet-emerald"></div>
      </div>
      <div class="orbit-track track-2" aria-hidden="true">
        <div class="orbit-comet comet-cyan"></div>
      </div>
      <div class="orbit-track track-3" aria-hidden="true">
        <div class="orbit-comet comet-gold"></div>
      </div>

      <!-- Rotating Card Suits Halo -->
      <div class="suits-halo" aria-hidden="true">
        <span class="suit spade">♠</span>
        <span class="suit heart">♥</span>
        <span class="suit diamond">♦</span>
        <span class="suit club">♣</span>
        <span class="suit spade">♠</span>
        <span class="suit heart">♥</span>
        <span class="suit diamond">♦</span>
        <span class="suit club">♣</span>
      </div>

      <!-- Core Crystal Token -->
      <div class="core-token">
        <div class="core-radar-sweep"></div>
        <div class="core-logo-wrap">
          <img src="/logo.png" alt="Spin Hub" class="brand-logo" />
        </div>
        <div class="core-pulse-beacon"></div>
      </div>
    </div>

    <!-- HUD Telemetry Panel -->
    <div class="telemetry-hud">
      <!-- Status Badge with Live Ping -->
      <div class="hud-status-badge">
        <span class="live-ping"></span>
        <span class="hud-status-text">{{ statusMessage }}</span>
      </div>

      <!-- Futuristic Cyber Segmented Progress -->
      <div class="cyber-meter">
        <div
          *ngFor="let s of segments; let i = index"
          class="meter-cell"
          [class.cell-active]="i <= activeSegment"
        ></div>
      </div>

      <!-- Security Certification Bar -->
      <div class="hud-security-tag">
        <i class="fa fa-shield"></i>
        <span>256-BIT SSL · PROVABLY FAIR VERIFIED</span>
      </div>
    </div>
  </div>
</div>
