<ngx-spinner
  bdColor="rgba(8, 12, 16, 0.95)"
  [fullScreen]="true"
>
  <div class="casino-loader-chassis">
    <!-- Ambient Holographic Glow Behind Chip -->
    <div class="loader-ambient-glow" aria-hidden="true"></div>

    <!-- 3D Luxury Casino Chip & Roulette Mechanism -->
    <div class="casino-chip-stage">
      <!-- Orbiting Glowing Roulette Ball -->
      <div class="roulette-ball-track" aria-hidden="true">
        <div class="roulette-ball"></div>
      </div>

      <!-- Outer Laser-Notched Neon Ring -->
      <div class="chip-ring chip-ring--outer" aria-hidden="true"></div>

      <!-- Rotating Golden Card Suit Ring -->
      <div class="chip-ring chip-ring--suits" aria-hidden="true">
        <span class="suit suit-spade">♠</span>
        <span class="suit suit-heart">♥</span>
        <span class="suit suit-diamond">♦</span>
        <span class="suit suit-club">♣</span>
        <span class="suit suit-spade">♠</span>
        <span class="suit suit-heart">♥</span>
        <span class="suit suit-diamond">♦</span>
        <span class="suit suit-club">♣</span>
      </div>

      <!-- Beveled Gold Marquee Ring with Inset LEDs -->
      <div class="chip-ring chip-ring--bezel" aria-hidden="true">
        <div class="bezel-led led-1"></div>
        <div class="bezel-led led-2"></div>
        <div class="bezel-led led-3"></div>
        <div class="bezel-led led-4"></div>
        <div class="bezel-led led-5"></div>
        <div class="bezel-led led-6"></div>
      </div>

      <!-- Center Floating VIP Token -->
      <div class="chip-core">
        <div class="core-radial-glow"></div>
        <div class="core-emblem">
          <img
            src="https://spinhub-6rb.pages.dev/assets/logo.png"
            alt="Spin Hub"
            class="core-logo"
          />
        </div>
        <div class="core-ring-pulse"></div>
      </div>
    </div>

    <!-- Telemetry HUD & Animated Status -->
    <div class="loader-hud">
      <!-- Live Status Pill -->
      <div class="hud-status-pill">
        <span class="status-ping"></span>
        <span class="status-text">{{ statusMessage }}</span>
      </div>

      <!-- High-Tech Neon Shimmer Progress Bar -->
      <div class="hud-progress-track">
        <div class="hud-progress-bar"></div>
      </div>

      <!-- Security Guarantee -->
      <div class="hud-security-tag">
        <i class="fa fa-shield-halved"></i>
        <span>256-BIT PROVABLY FAIR MATRIX</span>
      </div>
    </div>
  </div>
</ngx-spinner>
