<div class="container notifications-panel mx-auto p-4 absolute sm:w-[25rem] w-[20rem] top-16 sm:right-0 -right-4">
  <div *ngIf="isVisible" [class.closing]="isClosing"
    class="bg-[#161819] bg-noise border border-[#8c8066] p-4 rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] relative panel-enter">

    <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#8c8066]/30">
      <h3 class="text-white font-semibold text-sm">Notifications</h3>
    </div>

    <div #scrollContainer style="
        max-height: 24rem;
        overflow-y: auto;
        overflow-x: hidden;
        width: 100%;
      " (scroll)="onScroll($event)">

      <div *ngIf="notifications.length === 0" class="text-white text-center py-4">
        No notifications
      </div>

      <div *ngIf="notifications.length > 0" class="space-y-4 w-full">
        <div *ngFor="let notification of notifications; let i = index"
          class="cursor-pointer notification-card flex items-center bg-noise p-4 rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] relative text-white w-full"
          (click)="onNotificationClick(notification)" [class.removing]="notification.removing">

          <!-- Visible removed label while animating out -->
          <span *ngIf="notification.removing" class="removed-pill">Removed</span>
          <div class="notification-icon text-[#ffb24a] rounded-full p-2 mr-4 flex-shrink-0">
            <i class="fas fa-bell"></i>
          </div>

          <div class="notification-content flex-grow min-w-0">
            <strong class="block truncate">{{ notification.Type }}</strong>
            <p class="text-sm break-words opacity-90">{{ notification.Notifications }}</p>
            <div class="notification-meta flex justify-between text-xs opacity-60 mt-1">
              <span>{{
                notification.AddedDate | date: "yyyy MM, dd, hh:mm a"
                }}</span>
            </div>
          </div>

          <div class="close-btn absolute text-[#ffb24a] top-2 right-2 cursor-pointer opacity-70 hover:opacity-100 z-50"
            (click)="removeNotification(i, $event); $event.stopPropagation()">
            <i class="fas fa-times"></i>
          </div>
        </div>

        <div *ngIf="isLoading" class="text-center text-white py-2 text-xs">
          <i class="fas fa-spinner fa-spin mr-2"></i> Loading more...
        </div>

        <div *ngIf="!hasMore && notifications.length > 0" class="text-center text-white/50 py-2 text-xs">
          No more notifications.
        </div>
      </div>
    </div>
  </div>
</div>
