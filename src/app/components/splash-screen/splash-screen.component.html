<div *ngIf="isVisible" class="splash-screen-container fixed inset-0 z-[99999] bg-[#232626] flex flex-col items-center justify-center overflow-hidden font-sans select-none">
  <!-- Background Ambient Cyber Glows -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-gradient-to-tr from-[#2CD97D]/20 to-[#06B6D4]/10 blur-[180px] rounded-full pointer-events-none"></div>
  
  <!-- Cyber Grid Matrix Pattern -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff08_1px,transparent_1px),linear-gradient(to_bottom,#ffffff08_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] pointer-events-none"></div>

  <!-- Central Orbital Chassis -->
  <div class="relative z-10 flex flex-col items-center justify-center px-4 max-w-md w-full">
    
    <!-- Spinning Neon Loader Ring Structure -->
    <div class="relative w-48 h-48 sm:w-56 sm:h-56 flex items-center justify-center mb-8">
      
      <!-- Outer Pulsing Tech Ring -->
      <div class="absolute inset-0 rounded-full border border-[#2CD97D]/30 animate-ping opacity-25"></div>
      
      <!-- Outer Counter-Rotating Segmented Ring -->
      <div class="absolute inset-0 rounded-full border-2 border-dashed border-[#2CD97D]/60 animate-spin-slow"></div>
      
      <!-- Middle Glowing Gradient Ring -->
      <div class="absolute inset-2 rounded-full border-2 border-transparent border-t-[#2CD97D] border-r-[#06B6D4] border-b-[#FF9F1C] animate-spin shadow-[0_0_25px_rgba(44,217,125,0.4)]"></div>
      
      <!-- Inner Glow Backdrop -->
      <div class="absolute inset-6 rounded-full bg-[#292d2e] border border-[#2CD97D]/40 shadow-inner flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-radial-glow opacity-60"></div>
        
        <!-- Spin Hub Logo -->
        <img
          src="/logo.png"
          alt="Spin Hub"
          class="w-28 sm:w-32 h-auto relative z-10 object-contain drop-shadow-[0_0_20px_rgba(44,217,125,0.6)] animate-pulse"
        />
      </div>

      <!-- Floating Tech Corner Accents -->
      <span class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-[#2CD97D]"></span>
      <span class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-[#2CD97D]"></span>
      <span class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-[#2CD97D]"></span>
      <span class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-[#2CD97D]"></span>
    </div>

    <!-- Progress Meter & Telemetry -->
    <div class="w-full space-y-3 text-center">
      
      <!-- Status Text Banner -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#292d2e] border border-[#2CD97D]/40 text-[#2CD97D] text-[10px] sm:text-xs font-mono font-bold uppercase tracking-widest shadow-[0_0_15px_rgba(44,217,125,0.2)]">
        <span class="w-2 h-2 rounded-full bg-[#2CD97D] animate-ping"></span>
        <span>{{ statusText }}</span>
      </div>

      <!-- Cyber Progress Bar Container -->
      <div class="w-full bg-[#1c1e1e] h-3.5 rounded-full p-0.5 border border-[#2CD97D]/40 shadow-inner relative overflow-hidden">
        <div 
          class="h-full rounded-full bg-gradient-to-r from-[#2CD97D] via-[#4EFAAA] to-[#06B6D4] transition-all duration-150 relative shadow-[0_0_15px_rgba(44,217,125,0.6)]"
          [style.width.%]="progress"
        >
          <!-- Shimmer Sweep Line -->
          <div class="absolute inset-0 bg-[linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent)] animate-sweep"></div>
        </div>
      </div>

      <!-- Percentage Indicator -->
      <div class="flex items-center justify-between text-[11px] font-mono font-bold text-gray-400 px-1">
        <span class="text-white/60">SYSTEM LOADING</span>
        <span class="text-[#2CD97D] text-sm font-black">{{ progress }}%</span>
      </div>
    </div>

  </div>
</div>
