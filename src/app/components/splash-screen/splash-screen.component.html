<div *ngIf="isVisible" class="splash-screen">
  <!-- Expanding circles -->
  <div class="circles">
    <div *ngFor="let circle of circles" class="circle" [style.width.px]="circle * 100" [style.height.px]="circle * 100">
    </div>
  </div>

  <!-- Twinkling stars -->
  <div *ngFor="let star of stars; let i = index" class="star" [style.left]="star.left" [style.top]="star.top"
    [style.width.px]="star.size" [style.height.px]="star.size" [style.animation-duration.ms]="star.duration">
  </div>

  <!-- Content container -->
  <div class="content flex flex-col gap-8 justify-center items-center flex-wrap align-middle">
    <div class="logo">
      <img src="https://spinhub-6rb.pages.dev/assets/logo.png" alt="Spin Club">
    </div>

    <!-- Spin Club wheel loader -->
    <div class="spin-loader">
      <div class="spin-loader-ring"></div>
      <div class="spin-loader-ring spin-loader-ring--reverse"></div>
      <i class="fas fa-dharmachakra spin-loader-icon"></i>
    </div>

    <p class="progress-text">{{ progress }}% Loaded</p>
  </div>
</div>
