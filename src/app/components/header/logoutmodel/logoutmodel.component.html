<div *ngIf="isOpen" class="logout-overlay">
  <div class="logout-dialog" role="dialog" aria-modal="true" aria-labelledby="logout-title">
    <div class="logout-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
      </svg>
    </div>
    <span class="logout-kicker">Session security</span>
    <h2 id="logout-title">Sign out of Spin Hub?</h2>
    <p>Your current session will be closed on this device. You can sign in again anytime.</p>
    <div class="logout-actions">
      <button type="button" (click)="onCancel.emit()" class="logout-cancel">Stay signed in</button>
      <button type="button" (click)="onConfirm.emit()" class="logout-confirm">Log out</button>
    </div>
  </div>
</div>
