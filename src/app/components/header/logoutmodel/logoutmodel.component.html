<div *ngIf="isOpen" class="logout-overlay" (click)="cancel($event)">
  <div class="logout-dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="logout-title">
    <div class="logout-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
      </svg>
    </div>
    <span class="logout-kicker">SESSION SECURITY</span>
    <h2 id="logout-title">Sign Out of Spin Hub?</h2>
    <p>Your current gaming session will be securely closed on this device. You can log back in anytime.</p>
    <div class="logout-actions">
      <button type="button" (click)="cancel($event)" class="logout-cancel">Stay Signed In</button>
      <button type="button" (click)="confirm($event)" class="logout-confirm">Log Out</button>
    </div>
  </div>
</div>
