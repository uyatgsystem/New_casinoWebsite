<div *ngIf="isOpen" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 ring-opacity-95">
  <div
    class="bg-noise border border-[#C3B089] rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] w-[400px] p-8 text-center">
    <div class="flex justify-center mb-6">
      <img [src]="profileImage" alt="Profile" class="w-24 h-24 rounded-full object-cover" />
    </div>
    <h2 class="text-white text-xl mb-8">
      <!-- Are you sure you to Logout Spin Club account? -->
      Are you sure you want to Logout?
    </h2>
    <div class="flex gap-4 justify-center">
      <button (click)="onCancel.emit()" class="btn-outline">Cancel</button>
      <button (click)="onConfirm.emit()" class="btn-primary">Logout</button>
    </div>
  </div>
</div>
