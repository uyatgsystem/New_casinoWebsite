<app-loader></app-loader>
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-[9999] p-4"
>
  <div
    class="bg-[#292d2e] border border-[#2CD97D]/30 rounded-3xl w-full max-w-sm p-6 sm:p-8 text-center shadow-[0_0_50px_rgba(0,0,0,0.8)]"
  >
    <div class="flex justify-center mb-6">
      <img
        [src]="profileImage"
        alt="Profile"
        class="w-24 h-24 rounded-full object-cover border-2 border-[#2CD97D]/40 shadow-lg"
      />
    </div>
    <h2 class="text-white text-lg font-bold mb-6">
      Are you sure you want to delete your Spin Hub account?
    </h2>
    <div class="mb-6 relative">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [value]="password"
        (input)="updatePassword($event)"
        placeholder="Enter password to confirm"
        class="w-full p-3 bg-[#181c1e] border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#2CD97D] text-sm"
      />
      <fa-icon
        class="absolute right-4 top-[50%] transform -translate-y-1/2 cursor-pointer text-gray-400 hover:text-[#2CD97D]"
        (click)="togglePassword()"
        [icon]="showPassword ? hideicon : showicon"
      ></fa-icon>
    </div>
    <div class="flex gap-3 justify-center">
      <button
        (click)="onCancel.emit()"
        class="w-1/2 py-2.5 rounded-xl border border-white/20 text-gray-300 font-bold text-xs uppercase tracking-wider hover:bg-white/5 transition-colors"
      >
        Cancel
      </button>
      <button
        (click)="onConfirm.emit(password)"
        [disabled]="!isPasswordFilled"
        class="w-1/2 py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-700 text-white font-bold text-xs uppercase tracking-wider shadow-lg hover:brightness-110 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Delete
      </button>
    </div>
  </div>
</div>
