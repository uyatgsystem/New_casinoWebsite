<div class="w-full my-6 md:my-8 px-0">
  <div class="casino-premium-strip relative overflow-hidden rounded-xl flex items-center justify-between px-5 sm:px-6 py-4">
    
    <!-- Premium Top Golden Accent Line -->
    <div class="top-gold-bar"></div>

    <div class="flex items-center gap-4 z-10">
      <!-- Luxury Gold Icon Frame -->
      <div class="casino-icon-frame flex-shrink-0">
        <div class="casino-icon">💰</div>
      </div>

      <div class="leading-tight">
        <h3 class="text-white font-bold text-sm sm:text-base md:text-lg tracking-wider uppercase">
          Claim <span class="gold-glow-text">Referral Bonus</span>!
        </h3>

        <!-- Mobile view text -->
        <div class="md:hidden mt-1">
          <p class="text-slate-300 text-[11px] sm:text-xs">
            Invite friends and <span class="orange-text-accent font-bold">Earn a {{refPercentage}}% bonus</span>
          </p>
          <p class="text-slate-300 text-[11px] sm:text-xs">
            on each of their <span class="orange-text-accent font-bold">first {{refCount}} deposits!</span>
          </p>
        </div>

        <!-- Desktop view text -->
        <div class="hidden md:block mt-1">
          <p class="text-gray-300 text-xs md:text-sm tracking-wide">
            Invite friends and <span class="orange-text-accent font-bold">Earn a {{refPercentage}}% bonus</span> on each of their <span class="orange-text-accent font-bold">first {{refCount}} deposits!</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Matching Premium Gradient Action Button -->
    <button class="casino-gold-btn z-10" (click)="openrefral()">
      Claim Bonus
    </button>

  </div>
</div>
