<div class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-[9999]">
  <div
    class="bg-gradient-to-br from-[#161819] to-[#000408] text-white p-7 shadow-2xl w-[340px] text-center border border-[#C3B089] rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] relative">

    <!-- Close Button -->
    <button (click)="onClose()" class="absolute top-3 right-3 text-gray-400 hover:text-white transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="w-12 h-12 flex items-center justify-center rounded-full bg-yellow-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-yellow-400" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M12 3a9 9 0 110 18 9 9 0 010-18z" />
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-xl font-semibold mb-2">{{ title }}</h2>

    <!-- Message -->
    <p class="text-gray-300 text-sm leading-relaxed mb-6">
      {{ message }}
    </p>

    <!-- Action -->
    <button (click)="onAction()" [disabled]="isProcessing"
      class="w-full btn-primary transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
      {{ buttonText }}
    </button>
  </div>
</div>
