<div *ngIf="open()" class="fixed inset-0 z-[1000] flex items-end md:items-center justify-center modal-overlay" role="dialog"
  aria-modal="true" [attr.aria-labelledby]="'user-manual-title'" (click)="onBackdrop($event)">
  
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/85 backdrop-blur-sm transition-opacity duration-300"></div>

  <!-- Modal Card -->
  <div
    class="relative w-full md:w-[90vw] max-w-5xl h-[75vh] md:h-[80vh] max-h-[850px] bg-[#111315] 
           md:rounded-tl-[24px] md:rounded-tr-[8px] md:rounded-br-[24px] md:rounded-bl-[8px] 
           rounded-t-[24px] shadow-[0_0_40px_rgba(0,0,0,0.8)] flex flex-col 
           border border-[#C3B089]/30 modal slide-up overflow-hidden"
    (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="relative px-5 md:px-6 py-4 flex items-center justify-between bg-[#161819] border-b border-[#C3B089]/30 z-10">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 hidden md:flex rounded-tl-[12px] rounded-tr-[4px] rounded-br-[12px] rounded-bl-[4px] bg-gradient-to-br from-[#2a2d32] to-[#161819] border border-[#C3B089]/40 items-center justify-center text-[#F3A630] shadow-inner">
          <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <div>
          <h2 id="user-manual-title" class="text-lg md:text-xl font-bold tracking-wide text-white drop-shadow-md">
            {{ options.title }}
          </h2>
          <div class="text-xs md:text-sm font-medium text-[#C3B089]/80 mt-0.5">
             Step <span class="text-white px-1">{{ currentIndex() + 1 }}</span> of {{ steps().length }}
          </div>
        </div>
      </div>

      <button *ngIf="options.closable" (click)="close()" class="group rounded-full p-2.5 bg-[#1a1d21] border border-transparent hover:border-[#C3B089]/50 hover:bg-[#23272b] transition-all text-gray-400 hover:text-white" aria-label="Close">
        <svg viewBox="0 0 24 24" class="h-5 w-5 transform group-hover:rotate-90 transition-transform duration-300">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <!-- Segmented Progress Bar -->
    <div class="flex w-full gap-1.5 px-6 pt-3 pb-0 bg-[#0a0b0c] z-10 relative">
      <div *ngFor="let s of steps(); let i = index" 
           class="h-1.5 flex-1 rounded-full transition-all duration-500 ease-in-out"
           [ngClass]="i <= currentIndex() ? 'bg-gradient-to-r from-[#FEC866] to-[#FE8006] shadow-[0_0_8px_rgba(254,128,6,0.6)]' : 'bg-[#23272b]'">
      </div>
    </div>

    <!-- Main Content/Stage -->
    <div class="flex-1 flex flex-col relative bg-[#0a0b0c] overflow-y-auto overflow-x-hidden">
      <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#161819]/50 pointer-events-none"></div>

      <!-- Description Overlay -->
      <div *ngIf="steps()[currentIndex()].description" class="px-6 mx-auto pt-4 relative z-20 text-center max-w-3xl">
        <p class="text-sm md:text-base text-gray-200 font-medium drop-shadow-md whitespace-pre-line">
          {{ steps()[currentIndex()].description }}
        </p>
      </div>

      <!-- Image Area -->
      <div class="flex-1 relative p-4 md:p-8 flex items-center justify-center min-h-[30vh]">
         
        <!-- Desktop Previous Arrow -->
        <button (click)="prev()" [disabled]="currentIndex() === 0" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 hidden md:flex h-12 w-12 rounded-full bg-[#161819] border border-[#C3B089]/30 text-[#C3B089] hover:bg-gradient-to-r hover:from-[#FEC866] hover:to-[#FE8006] hover:border-transparent hover:text-black hover:scale-110 shadow-lg items-center justify-center disabled:opacity-0 disabled:scale-100 transition-all duration-300 z-30">
          <svg viewBox="0 0 24 24" class="h-6 w-6 ml-[-2px]"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
         
        <!-- Image Wrapper -->
        <div class="relative w-full h-full flex items-center justify-center z-20">
          <ng-container *ngFor="let s of steps(); index as i">
            <div *ngIf="i === currentIndex()" [@crossSlide]="{ value: i, params: animParams }" class="absolute inset-0 flex items-center justify-center">
              <picture class="block max-h-full max-w-full flex items-center justify-center">
                <source *ngIf="steps()[currentIndex()].imageUrlLg" media="(min-width: 768px)" [srcset]="steps()[currentIndex()].imageUrlLg" />
                <source *ngIf="steps()[currentIndex()].imageUrlSm" media="(max-width: 767.98px)" [srcset]="steps()[currentIndex()].imageUrlSm" />
                <img [src]="steps()[currentIndex()].imageUrl || steps()[currentIndex()].imageUrlLg || steps()[currentIndex()].imageUrlSm" 
                     [alt]="steps()[currentIndex()].alt || steps()[currentIndex()].title || 'Guide image'" 
                     class="max-h-[45vh] md:max-h-[55vh] max-w-full rounded-2xl object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.6)] border border-white/5"
                     (load)="imageLoaded = true" loading="eager" />
              </picture>
            </div>
          </ng-container>
          
          <!-- Image Loading State -->
          <div *ngIf="!imageLoaded" class="absolute inset-0 flex items-center justify-center">
             <div class="h-10 w-10 md:h-12 md:w-12 rounded-full border-4 border-[#23272b] border-t-[#C3B089] animate-spin shadow-[0_0_15px_rgba(195,176,137,0.3)]"></div>
          </div>
        </div>
          
        <!-- Desktop Next Arrow -->
        <button (click)="next()" [disabled]="currentIndex() === steps().length - 1" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 hidden md:flex h-12 w-12 rounded-full bg-[#161819] border border-[#C3B089]/30 text-[#C3B089] hover:bg-gradient-to-r hover:from-[#FEC866] hover:to-[#FE8006] hover:border-transparent hover:text-black hover:scale-110 shadow-lg items-center justify-center disabled:opacity-0 disabled:scale-100 transition-all duration-300 z-30">
          <svg viewBox="0 0 24 24" class="h-6 w-6 mr-[-2px]"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="px-5 md:px-6 py-4 bg-[#161819] border-t border-[#C3B089]/30 flex items-center justify-between z-30 relative shrink-0">
      
      <!-- Keyboard navigation hints (Desktop only) -->
      <div class="hidden md:flex items-center gap-3 text-xs font-medium text-gray-500">
        <div class="flex items-center gap-1">
          <kbd class="px-2 py-1 bg-[#23272b] rounded border border-[#C3B089]/30 text-[#C3B089] shadow-sm">← / →</kbd>
          <span class="tracking-wide ml-1">NAVIGATE</span>
        </div>
        <span class="text-gray-700">|</span>
        <div class="flex items-center gap-1">
          <kbd class="px-2 py-1 bg-[#23272b] rounded border border-gray-700 text-gray-400 shadow-sm">ESC</kbd>
          <span class="tracking-wide ml-1">CLOSE</span>
        </div>
      </div>

      <!-- Mobile Action Buttons -->
      <div class="flex items-center justify-between md:justify-end gap-3 w-full md:w-auto">
        <button (click)="prev()" [disabled]="currentIndex() === 0" 
                class="flex-1 md:flex-none px-6 md:px-8 py-2.5 rounded-tl-[14px] rounded-tr-[4px] rounded-br-[14px] rounded-bl-[4px] border border-[#C3B089]/50 text-white hover:bg-[#C3B089]/10 hover:text-[#C3B089] disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-white transition-all font-semibold text-sm">
           Back
        </button>
        <button *ngIf="currentIndex() < steps().length - 1" (click)="next()" 
                class="flex-1 md:flex-none px-8 py-2.5 rounded-tl-[14px] rounded-tr-[4px] rounded-br-[14px] rounded-bl-[4px] bg-gradient-to-r from-[#FEC866] to-[#FE8006] text-black font-bold text-sm hover:brightness-110 hover:shadow-[0_0_15px_rgba(254,128,6,0.4)] transition-all">
           Next
        </button>
        <button *ngIf="currentIndex() === steps().length - 1" (click)="close()" 
                class="flex-1 md:flex-none px-8 py-2.5 rounded-tl-[14px] rounded-tr-[4px] rounded-br-[14px] rounded-bl-[4px] bg-gradient-to-r from-[#FEC866] to-[#FE8006] text-black font-bold text-sm hover:brightness-110 hover:shadow-[0_0_15px_rgba(254,128,6,0.4)] transition-all">
           Finish
        </button>
      </div>
    </div>

  </div>
</div>
