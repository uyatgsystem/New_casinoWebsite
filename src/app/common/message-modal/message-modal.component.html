<div
  *ngIf="show"
  class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
>
  <div
    class="absolute inset-0 bg-black/80 backdrop-blur-sm"
    (click)="closeModal()"
    aria-hidden="true"
  ></div>
  <div
    class="relative bg-[#0C101D] border border-[#00F5D4]/40 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-[0_0_30px_rgba(0,245,212,0.25)] text-center z-10"
  >
    <!-- close -->
    <button
      class="absolute right-3 top-3 text-slate-400 hover:text-[#00F5D4] w-8 h-8 flex items-center justify-center text-2xl transition-colors"
      (click)="closeModal()"
      aria-label="Close"
    >
      &times;
    </button>

    <h3 class="text-[#FF9F1C] text-xl font-extrabold mb-2 drop-shadow">
      {{ title }}
    </h3>
    <p class="text-slate-300 text-sm sm:text-base mb-6 font-medium">
      {{ message }}
    </p>

    <button
      class="px-6 py-2.5 rounded-xl bg-[#00F5D4] text-[#050811] font-extrabold text-xs uppercase tracking-wider shadow-[0_0_15px_rgba(0,245,212,0.4)] hover:bg-[#00d6b9] transition-all"
      (click)="closeModal()"
    >
      Got It
    </button>
  </div>
</div>
