<div *ngIf="show" class="fixed inset-0 z-50 flex items-center justify-center">
  <div
    class="absolute inset-0 bg-black/60"
    (click)="closeModal()"
    aria-hidden="true"
  ></div>
  <div
    class="relative bg-[#2d2036] border border-gray-500 rounded-2xl p-6 w-[90vw] max-w-md shadow-2xl text-center"
  >
    <!-- close -->
    <button
      class="absolute -right-1 top-3 text-white w-12 flex items-center justify-center text-2xl"
      (click)="closeModal()"
      aria-label="Close"
    >
      &times;
    </button>

    <!-- icon -->
    <!-- <div class="mx-auto mb-3 h-12 w-12 rounded-full flex items-center justify-center" [ngStyle]="{'background-color': iconColor+'33',
                 'box-shadow': '0 0 10px '+iconColor+'99',
                 'border': '1px solid '+iconColor}">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2">
        <path [attr.d]="iconSvg"></path>
      </svg>
    </div> -->

    <h3 class="text-yellow-400 text-xl font-extrabold mb-1">{{ title }}</h3>
    <p class="text-purple-200 text-md mb-5 mt-5">{{ message }}</p>

      (click)="closeModal()">
      Close
    </button> -->
  </div>
</div>
