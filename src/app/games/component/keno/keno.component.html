<section class="perspective-container relative min-h-screen overflow-hidden px-2 pt-0 pb-6 sm:py-8 text-slate-100 font-sans bg-cover bg-center bg-no-repeat" style="background: linear-gradient(145deg, rgba(11,15,26,0.94), rgba(22,24,25,0.9)), radial-gradient(circle at 18% 22%, rgba(254,200,102,0.18), transparent 42%), radial-gradient(circle at 84% 78%, rgba(254,137,18,0.2), transparent 45%), radial-gradient(circle at 52% 8%, rgba(243,166,48,0.14), transparent 40%);">
  <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
  <div class="pointer-events-none absolute -top-24 -left-24 h-[600px] w-[600px] rounded-full bg-amber-300/20 blur-[160px] mix-blend-lighten"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 h-[600px] w-[600px] rounded-full bg-orange-400/20 blur-[160px] mix-blend-lighten"></div>

  <div class="relative mx-auto max-w-6xl">
    <!-- Game result toaster notification -->
    <div *ngIf="showResultToast" class="fixed top-4 left-1/2 z-50 -translate-x-1/2 px-6 py-3 rounded-xl shadow-xl bg-gradient-to-r from-[#fec866] to-[#fe8912] text-[#161819] font-black text-lg animate-toast-pop border-2 border-amber-200/70">
      {{ resultToastMessage }}
    </div>
    
<header class="relative mb-12 flex flex-col items-center pt-4 px-4 sm:px-0">
  
  <div class="absolute top-10 h-[1px] w-full max-w-7xl bg-gradient-to-r from-transparent via-amber-500/40 to-transparent"></div>

  <div class="relative z-10 flex w-full max-w-7xl items-center justify-between">
    
    <div class="flex items-center">
      <div class="relative group">
        <div class="absolute inset-0 bg-amber-500/10 skew-x-[-20deg] rounded-l-md border-l-2 border-amber-500/50 transition-all group-hover:bg-amber-500/20"></div>
        
        <button (click)="goBack()" 
                class="relative flex items-center gap-3 px-6 py-3 transition-transform active:scale-95">
          <div class="flex h-6 w-6 items-center justify-center rounded-full border border-amber-500/50 bg-black/50 text-amber-500">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-3 h-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </div>
          <div class="flex flex-col items-start leading-none">
            <span class="text-[8px] font-black uppercase tracking-[0.2em] text-amber-500/60">System</span>
            <span class="text-xs font-black tracking-widest text-white uppercase italic">Exit</span>
          </div>
        </button>
      </div>
    </div>

    <div class="relative">
      <div class="absolute -inset-x-8 -inset-y-2 bg-[#0b0e14] border-x border-amber-500/30 skew-x-[15deg] shadow-[0_0_30px_rgba(0,0,0,0.8)]"></div>
      
      <div class="relative flex flex-col items-center">
        <h1 class="bg-gradient-to-t from-amber-600 via-amber-200 to-white bg-clip-text text-4xl sm:text-6xl font-[1000] tracking-tighter text-transparent italic leading-none px-4">
          KENO
        </h1>
        
        <div class="mt-1 flex items-center gap-2">
          <div class="h-[1px] w-6 bg-gradient-to-r from-transparent to-amber-500/50"></div>
          <div class="h-1 w-1 rotate-45 bg-amber-500 shadow-[0_0_8px_#f59e0b]"></div>
          <div class="h-[1px] w-6 bg-gradient-to-l from-transparent to-amber-500/50"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center">
      <div class="relative group">
        <div class="absolute inset-0 bg-white/[0.03] skew-x-[20deg] rounded-r-md border-r-2 border-white/10 backdrop-blur-md"></div>
        
        <div class="relative flex items-center gap-4 px-6 py-2 sm:py-3">
          <div class="flex flex-col items-end leading-none">
            <span class="text-[8px] font-black uppercase tracking-[0.2em] text-slate-500 mb-1">Balance</span>
            <div class="flex items-baseline gap-1">
              <span class="text-xs font-black text-amber-500/50">$</span>
              <span class="font-mono text-xl sm:text-3xl font-black tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.1)]">
                {{ this.getRoundedBalance() }}
              </span>
            </div>
          </div>
          
          <div class="relative hidden sm:block">
             <div class="h-10 w-10 rounded-full border-2 border-dashed border-amber-500/30 p-1 animate-[spin_10s_linear_infinite]"></div>
             <div class="absolute inset-0 flex items-center justify-center">
               <div class="h-6 w-6 rounded-full bg-amber-500/10 border border-amber-500/40 flex items-center justify-center">
                 <div class="h-2 w-2 rounded-full bg-amber-500 shadow-[0_0_10px_#f59e0b]"></div>
               </div>
             </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="mt-4 flex items-center gap-4 text-[7px] font-bold uppercase tracking-[0.4em] text-slate-600">
    <span>Module: 08-Draw</span>
    <span class="h-1 w-1 rounded-full bg-slate-800"></span>
    <span>Secure Transaction Layer</span>
  </div>
</header>

<div class="grid gap-6 lg:grid-cols-12 bg-[#05070a] p-2 sm:p-6 font-sans text-slate-200">
  
  <div class="lg:col-span-8 flex flex-col gap-4">
    
    <div class="lg:hidden">
      <button (click)="isControlPanelCollapsed = !isControlPanelCollapsed"
              class="w-full flex items-center justify-between px-5 py-4 bg-gradient-to-r from-amber-500/20 to-transparent border border-amber-500/30 rounded-2xl backdrop-blur-md transition-all active:scale-95">
        <div class="flex items-center gap-3">
          <div class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></div>
          <span class="text-amber-100 text-xs font-black uppercase tracking-widest">Configuration</span>
        </div>
        <svg [ngClass]="{'rotate-180': !isControlPanelCollapsed}" class="w-5 h-5 text-amber-400 transition-transform duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div *ngIf="!isControlPanelCollapsed" class="mt-3 p-4 rounded-2xl bg-[#0f121a] border border-white/5 shadow-2xl animate-in slide-in-from-top-4 duration-300">
         <ng-container *ngTemplateOutlet="gameControls"></ng-container>
      </div>
    </div>

    <div class="relative group">
      <div class="absolute inset-0 pointer-events-none rounded-[2.5rem] z-20 overflow-hidden opacity-[0.03]">
        <div class="h-full w-full bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_4px,3px_100%]"></div>
      </div>

      <div class="relative z-10 bg-[#0d1017] p-4 sm:p-8 rounded-[2.5rem] border border-slate-800 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
        <div class="absolute inset-0 rounded-[2.5rem] shadow-[inset_0_0_100px_rgba(245,158,11,0.03)] pointer-events-none"></div>
        
        <div class="grid grid-cols-8 gap-1 sm:gap-2 sm:grid-cols-10">
          <button
            *ngFor="let value of boardNumbers; trackBy: trackByNumber"
            (click)="toggleNumber(value)"
            [disabled]="isInteractionLocked"
            class="tile-3d relative aspect-square rounded-md sm:rounded-xl text-xs sm:text-base font-black transition-all duration-200 border-b-2 sm:border-b-4 active:translate-y-1 active:border-b-0 p-0"
            [ngClass]="getTileClasses(value)">
            <span class="relative z-10">{{ value }}</span>
          </button>
        </div>
      </div>
    </div>

    <div class="hidden lg:block">
        <div class="bg-[#0f121a] border border-white/[0.05] rounded-[2rem] p-4 shadow-xl">
            <ng-container *ngTemplateOutlet="gameControls"></ng-container>
        </div>
    </div>
  </div>

  <div class="lg:col-span-4">
    <div class="sticky top-6 relative overflow-hidden rounded-[2.5rem] border border-slate-800 bg-[#0b0e14] p-1 shadow-2xl">
      <div class="flex items-center justify-between px-6 py-5 bg-white/[0.02] rounded-t-[2.3rem] border-b border-white/[0.05]">
        <div>
          <h3 class="text-[10px] font-black uppercase tracking-[0.4em] text-amber-500">Global Paytable</h3>
          <p class="text-[9px] text-slate-500 font-bold mt-1">REAL-TIME MULTIPLIERS</p>
        </div>
        <div class="flex items-center gap-3 bg-black/40 px-3 py-2 rounded-2xl border border-white/5">
          <span class="text-xl font-mono font-black text-amber-400">{{ selectedNumbers.length }}</span>
          <span class="text-[8px] text-slate-500 uppercase font-black leading-none">Selected<br>Picks</span>
        </div>
      </div>

      <div class="p-4">
        <div class="grid grid-cols-2 gap-3 max-h-[600px] overflow-y-auto pr-2 custom-scroll">
          <div *ngFor="let row of paytableEntries" 
               class="relative group transition-all duration-500"
               [ngClass]="isPaytableHit(row.matches) ? 'col-span-2' : 'col-span-1'">
            
            <div class="relative h-full overflow-hidden rounded-2xl border transition-all duration-300"
                 [ngClass]="isPaytableHit(row.matches) 
                            ? 'bg-gradient-to-br from-amber-500/30 to-orange-600/10 border-amber-400 shadow-[0_0_30px_rgba(245,158,11,0.2)]' 
                            : 'bg-white/[0.03] border-white/5 hover:border-white/20 hover:bg-white/[0.06]'">
              
              <div class="flex items-center justify-between p-4">
                <div class="flex flex-col">
                  <span class="text-[9px] font-black uppercase opacity-50">Match</span>
                  <span class="text-2xl font-black italic tracking-tighter"
                        [ngClass]="isPaytableHit(row.matches) ? 'text-white' : 'text-slate-400'">
                    {{ row.matches }}
                  </span>
                </div>
                <div class="inline-flex items-center justify-center px-4 py-2 rounded-xl border font-mono font-black transition-all"
                     [ngClass]="isPaytableHit(row.matches) 
                                ? 'bg-amber-400 text-black border-white shadow-xl scale-110' 
                                : 'bg-black/60 text-amber-500 border-white/5 group-hover:text-amber-300'">
                  {{ row.multiplier }}x
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="px-8 py-4 bg-black/60 rounded-b-[2.3rem] flex justify-between items-center">
          <div class="flex gap-1.5">
              <div class="h-1.5 w-1.5 rounded-full bg-green-500/50 shadow-[0_0_8px_green]"></div>
              <span class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Engine Active</span>
          </div>
          <span class="text-[10px] font-mono text-slate-600">v2.0.4-PRO</span>
      </div>
    </div>
  </div>
</div>

<ng-template #gameControls>
  <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <button (click)="quickPick()" [disabled]="isInteractionLocked" 
              class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-black text-xs uppercase tracking-widest bg-slate-800 hover:bg-slate-700 disabled:opacity-50 transition-all border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">
        Auto Pick
      </button>
      <button (click)="clearBoard()" [disabled]="isInteractionLocked" 
              class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-black text-xs uppercase tracking-widest bg-rose-900/20 text-rose-500 border border-rose-500/20 hover:bg-rose-500 hover:text-white transition-all">
        Clear
      </button>
    </div>

    <div class="flex items-center gap-6 w-full sm:w-auto">
      <div class="flex flex-col grow sm:grow-0">
        <label class="text-[9px] font-black text-amber-500/60 uppercase mb-1 tracking-[0.2em]">Stake Amount</label>
        <div class="flex items-center bg-black/40 rounded-2xl px-4 py-1 border border-white/10 focus-within:border-amber-500/50 transition-colors">
          <span class="text-amber-500 font-black text-xl">$</span>
          <input [(ngModel)]="betAmount" (ngModelChange)="onBetAmountChange($event)" (keydown)="onBetKeyDown($event)" 
                 type="number" class="w-16 bg-transparent py-2 text-xl font-black outline-none text-white text-center">
        </div>
      </div>
      
      <button (click)="play()" [disabled]="!canPlay" 
              class="relative grow sm:grow-0 overflow-hidden group/btn px-10 py-4 rounded-2xl bg-amber-500 disabled:bg-slate-800 disabled:text-slate-600 transition-all duration-300 shadow-[0_10px_20px_rgba(245,158,11,0.2)] hover:shadow-amber-500/40">
        <span class="relative z-10 font-black text-black uppercase tracking-tighter text-lg group-hover/btn:scale-110 block transition-transform">
          Start Game
        </span>
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full group-hover/btn:animate-[shimmer_1.5s_infinite]"></div>
      </button>
    </div>
  </div>
</ng-template>

<style>
/* Custom Scrollbar for the Paytable */
.custom-scroll::-webkit-scrollbar { width: 4px; }
.custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
.custom-scroll::-webkit-scrollbar-thumb { background: rgba(245,158,11,0.2); border-radius: 10px; }
.custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(245,158,11,0.5); }

@keyframes shimmer {
  100% { transform: translateX(100%); }
}
</style>
  </div>
</section>
