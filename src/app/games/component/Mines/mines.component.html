<div class="mines-shell min-h-screen text-white">
  <div class="grain-Backdrop" [innerHTML]="grainBackdrop"></div>
  <div class="mx-auto w-full max-w-[1180px] px-2 py-2 sm:px-4 sm:py-6">
    <div class="w-full mb-2 sm:mb-3">
      <button (click)="goBack()" class="back-btn flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-bold">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="#fec866" class="w-4 h-4 sm:w-5 sm:h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Back
      </button>
    </div>
    <div class="flex flex-col gap-4 lg:flex-row lg:gap-6">
      <!-- Left: Control Panel -->
      <app-control-panel
        [balance]="balance"
        [betAmount]="betAmount"
        [numberOfMines]="numberOfMines"
        [gridSize]="gridSize"
        [gameState]="gameState"
        [soundEnabled]="soundEnabled"
        [musicEnabled]="musicEnabled"
        [mineOptions]="mineOptions"
        [gridSizes]="gridSizes"
        (startGame)="startGame()"
        (cashOut)="cashOut()"
        (resetGame)="resetGame()"
        (adjustBet)="adjustBet($event)"
        (setMineCount)="setMineCount($event)"
        (setGridSize)="setGridSize($event)"
        (setSelectionLimit)="setSelectionLimit($event)"
        (toggleSound)="toggleSound()"
        (toggleMusic)="toggleMusic()">
      </app-control-panel>

      <!-- Right: Board -->
      <div class="flex-1">
        <div class="board-shell rounded-2xl p-3 ring-1 ring-white/15 sm:p-4 more-frosted-ui-container">
          <app-game-header
            [currentMultiplier]="gameState.currentMultiplier"
            [betAmount]="betAmount"
            [revealedTiles]="gameState.revealedTiles"
            [multiplierDisplay]="getMultiplierDisplay()">
          </app-game-header>

          <div class="relative">
            <app-game-grid
              [tiles]="tiles"
              [gameState]="gameState"
              [gridSize]="gridSize"
              (tileClick)="revealTile($event)">
            </app-game-grid>

            <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
              <app-game-status [gameState]="gameState"></app-game-status>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
