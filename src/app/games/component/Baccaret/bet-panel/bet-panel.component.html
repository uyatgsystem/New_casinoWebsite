<div class="bet-panel bg-gradient-to-br from-amber-900 to-amber-950 rounded-xl p-6 shadow-2xl border-4 border-amber-700">
  <h3 class="text-xl font-bold text-amber-100 mb-4 text-center">Place Your Bet</h3>
  
  <!-- Chip Selection -->
  <div class="mb-6">
    <p class="text-sm text-amber-200 mb-2">Select Chip Value:</p>
    <div class="flex gap-2 justify-center flex-wrap">
      <button
        *ngFor="let chip of chipValues"
        (click)="selectChip(chip)"
        [disabled]="chip > balance || isGameInProgress"
        [class.ring-4]="selectedChip === chip"
        [class.ring-yellow-400]="selectedChip === chip"
        class="chip w-14 h-14 sm:w-16 sm:h-16 rounded-full font-bold text-white shadow-lg transform transition-all hover:scale-110 disabled:opacity-40 disabled:cursor-not-allowed"
        [ngClass]="getChipColorClass(chip)"
        [attr.title]="chip > balance ? 'Insufficient balance' : ''"
      >
        ${{chip}}
      </button>
    </div>
  </div>

  <!-- Current Bet Display -->
  <div class="mb-4 text-center bg-black bg-opacity-30 rounded-lg p-3">
    <p class="text-amber-200 text-sm">Current Bet</p>
    <p class="text-3xl font-bold text-yellow-400">${{currentBet}}</p>
  </div>

  <!-- Bet Options -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <button
      (click)="placeBet('player')"
      [disabled]="isGameInProgress"
      [class.opacity-50]="isGameInProgress"
      [class.ring-4]="selectedBetType === 'player'"
      [class.ring-blue-400]="selectedBetType === 'player'"
      class="bet-button bg-gradient-to-br from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-4 px-3 rounded-lg shadow-lg transform transition-all hover:scale-105 disabled:cursor-not-allowed"
    >
      <div class="text-xs mb-1">PLAYER</div>
      <div class="text-sm">1:1</div>
    </button>

    <button
      (click)="placeBet('tie')"
      [disabled]="isGameInProgress"
      [class.opacity-50]="isGameInProgress"
      [class.ring-4]="selectedBetType === 'tie'"
      [class.ring-green-400]="selectedBetType === 'tie'"
      class="bet-button bg-gradient-to-br from-green-600 to-green-800 hover:from-green-500 hover:to-green-700 text-white font-bold py-4 px-3 rounded-lg shadow-lg transform transition-all hover:scale-105 disabled:cursor-not-allowed"
    >
      <div class="text-xs mb-1">TIE</div>
      <div class="text-sm">8:1</div>
    </button>

    <button
      (click)="placeBet('banker')"
      [disabled]="isGameInProgress"
      [class.opacity-50]="isGameInProgress"
      [class.ring-4]="selectedBetType === 'banker'"
      [class.ring-red-400]="selectedBetType === 'banker'"
      class="bet-button bg-gradient-to-br from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white font-bold py-4 px-3 rounded-lg shadow-lg transform transition-all hover:scale-105 disabled:cursor-not-allowed"
    >
      <div class="text-xs mb-1">BANKER</div>
      <div class="text-sm">0.95:1</div>
    </button>
  </div>

  <!-- Action Buttons -->
  <div class="grid grid-cols-2 gap-3">
    <button
      (click)="clearBet()"
      [disabled]="isGameInProgress || currentBet === 0"
      class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all"
    >
      Clear
    </button>
    
    <button
      (click)="confirmBet()"
      [disabled]="isGameInProgress || currentBet === 0 || !selectedBetType"
      class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-bold py-3 px-4 rounded-lg shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all"
    >
      Deal Cards
    </button>
  </div>

  <!-- Bet Info -->
  <div *ngIf="selectedBetType && currentBet > 0" class="mt-4 text-center text-amber-100 text-sm">
    Betting ${{currentBet}} on <span class="font-bold uppercase">{{selectedBetType}}</span>
  </div>
</div>
