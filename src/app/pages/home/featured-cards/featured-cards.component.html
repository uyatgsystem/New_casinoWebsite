  <!-- Content  -->
  <div
    class="overflow-hidden transition-all duration-500 ease-in-out sm:col-span-1 col-span-1"
    [class.max-h-0]="!cardsOpen"
    [class.opacity-0]="!cardsOpen"
    [class.max-h-[600px]]="cardsOpen"
    [class.opacity-100]="cardsOpen"
  >
    <owl-carousel-o [options]="carouselOptions">
      <ng-template carouselSlide *ngFor="let card of cards">
        <div
          (click)="$event.stopPropagation(); openModule(card.key, $event)"
          class="relative flex items-center justify-between rounded-tl-xl rounded-br-xl p-4
         bg-gradient-to-br {{ card.gradient }}
         overflow-hidden h-36 sm:h-40 md:h-44"
        >
          <!-- Decorative circles -->
          <div class="absolute inset-0 opacity-40">
            <div
              class="absolute -left-16 top-0 w-64 h-64 rounded-full border-[18px] border-white/10"
            ></div>
            <div
              class="absolute -left-20 top-6 w-80 h-80 rounded-full border-[18px] border-white/5"
            ></div>
          </div>

          <!-- HOT badge -->
          <div
            *ngIf="card.hotKey && hotBadges[card.hotKey]"
            class="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-20 shadow-md"
          >
            {{ hotBadges[card.hotKey] }}
          </div>

          <!-- Content -->
          <div class="relative z-10">
            <div class="flex flex-col mb-4">
              <h4
                class="text-xl sm:text-2xl font-bold text-white leading-tight"
              >
                {{ card.title }}
              </h4>
              <p class="text-sm text-white/80">
                {{ card.subtitle }}
              </p>
            </div>

            <button
              class="w-[7.4rem] bg-gradient-to-b from-[#FEC866] to-[#FE8006] text-gray-900 rounded-tl-xl rounded-br-xl text-sm font-semibold py-1.5 px-4 shadow hover:bg-yellow-300 transition"
            >
              Start Playing
            </button>
          </div>

          <!-- Image -->
          <img
            [src]="card.image"
            class="relative z-10 w-20 h-20 sm:w-24 sm:h-24 md:w-30 md:h-30 object-contain"
          />
        </div>
      </ng-template>
    </owl-carousel-o>
  </div>
  <!-- </div> -->
</div>
