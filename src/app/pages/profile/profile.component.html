<div class="min-h-screen py-8 px-4 flex justify-center items-start bg-[#232626]">
  <div class="w-full max-w-md">
    <!-- Operative Profile Card -->
    <div
      class="relative p-6 sm:p-8 rounded-3xl bg-[#292d2e] border border-[#2CD97D]/40 shadow-[0_20px_60px_rgba(0,0,0,0.85),0_0_25px_rgba(44,217,125,0.1)] overflow-hidden text-center mb-6"
    >
      <div
        class="absolute top-0 left-0 right-0 h-28 bg-radial-glow pointer-events-none"
      ></div>

      <!-- Avatar with neon ring & camera button -->
      <div class="relative w-28 h-28 mx-auto mb-4 z-10">
        <img
          [src]="profileImage || '/logo.png'"
          alt="Profile Picture"
          class="w-full h-full rounded-full object-cover border-3 border-[#2CD97D] shadow-[0_0_25px_rgba(44,217,125,0.5)] bg-[#050811]"
        />
        <button
          type="button"
          (click)="saveUserProfileImage()"
          class="absolute bottom-0 right-0 bg-[#2CD97D] text-[#050811] rounded-full p-2.5 shadow-lg border-2 border-[#050811] hover:scale-110 hover:shadow-[0_0_15px_rgba(44,217,125,0.8)] transition-all cursor-pointer"
          title="Upload photo"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
          </svg>
        </button>
      </div>

      <h1 class="text-xl sm:text-2xl font-black text-white mb-1 tracking-wide uppercase">
        {{ name || "OPERATIVE" }}
      </h1>
      <p class="text-xs sm:text-sm text-gray-400 font-mono truncate">
        {{ email || "operative@system.net" }}
      </p>

      <div class="mt-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#2CD97D]/10 border border-[#2CD97D]/30 text-[#2CD97D] text-[10px] font-mono font-bold tracking-widest uppercase">
        <span class="w-2 h-2 rounded-full bg-[#2CD97D] animate-pulse"></span>
        OPERATIVE ACTIVE
      </div>
    </div>

    <!-- Actions & Settings Grid -->
    <div class="space-y-3">
      <span class="text-[10px] font-mono font-bold uppercase tracking-widest text-gray-500 px-1">
        ACCOUNT SETTINGS
      </span>

      <!-- Complete Profile Link -->
      <a
        (click)="changeRoute('/dashboard/complete-profile')"
        class="cyber-profile-node group"
      >
        <div class="node-icon">
          <svg class="w-5 h-5 text-[#2CD97D]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <div class="node-text">
          <span class="title">Complete Profile</span>
          <span class="sub">Full Settings & Ledger</span>
        </div>
        <svg class="node-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Change Password -->
      <a
        (click)="changeRoute('/dashboard/changePass')"
        class="cyber-profile-node group"
      >
        <div class="node-icon">
          <svg class="w-5 h-5 text-[#2CD97D]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
          </svg>
        </div>
        <div class="node-text">
          <span class="title">Change Password</span>
          <span class="sub">Update Security Key</span>
        </div>
        <svg class="node-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Forgot Password -->
      <a
        (click)="changeRoute('/ForgotPassword')"
        class="cyber-profile-node group"
      >
        <div class="node-icon">
          <svg class="w-5 h-5 text-[#2CD97D]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div class="node-text">
          <span class="title">Forgot Password</span>
          <span class="sub">Reset Credentials</span>
        </div>
        <svg class="node-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Remove Image -->
      <a
        (click)="deleteUserProfileImage()"
        class="cyber-profile-node group delete-node"
      >
        <div class="node-icon danger">
          <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </div>
        <div class="node-text">
          <span class="title text-red-400">Remove Photo</span>
          <span class="sub text-gray-500">Restore Default Avatar</span>
        </div>
        <svg class="node-arrow text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>
  </div>
</div>
