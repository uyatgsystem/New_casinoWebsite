<!-- Card 1 -->

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <div *ngFor="let lottery of lotteries"
    class="lottery-card-glassmorphic bg-white/10 rounded-lg p-6 backdrop-blur-lg border border-white/20 shadow-lg">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="relative w-12 h-12 flex-shrink-0">
          <div class="absolute inset-0 bg-red-600 rounded-lg transform rotate-45"></div>
          <div class="absolute inset-0 flex items-center justify-center text-yellow-400 font-bold text-xs">
            {{ lottery?.InitialCode }}
          </div>
        </div>
        <span class="text-white text-lg font-medium">{{
          lottery?.LotteryName
          }}</span>
      </div>
      <div class="px-3 py-1 rounded-full font-bold border-2 border-yellow-500 text-yellow-500">
        $ {{ lottery?.TicketPrice }}
      </div>
    </div>

    <div class="text-right mb-4">
      <span class="text-gray-400">Total Tickets: </span>
      <span class="text-purple-400">{{ lottery?.TotalTickets }}</span>
    </div>

    <div class="flex justify-center items-center gap-2 mb-4">
      <div *ngFor="let time of lottery?.timeLeft; let i = index" class="flex items-center">
        <div class="bg-purple-700 w-14 h-14 rounded-lg flex items-center justify-center text-white text-xl">
          {{ time }}
        </div>
        <span *ngIf="i < lottery.timeLeft.length - 1" class="text-white text-xl mx-2">:</span>
      </div>
    </div>

    <p class="text-center text-purple-400 mb-4">Time Left for the Big Win!</p>

    <button [class.opacity-50]="lottery.isDisabled" [disabled]="lottery.isDisabled"
      [class.cursor-not-allowed]="lottery.isDisabled" [class.cursor-pointer]="!lottery.isDisabled"
      [class]="lottery.buttonStyle" class="w-full py-3 rounded-lg transition-colors"
      (click)="redirectToTicketPage(lottery)">
      Get Ticket Now
    </button>
  </div>
  <!-- First Row - Green Buttons -->
</div>
