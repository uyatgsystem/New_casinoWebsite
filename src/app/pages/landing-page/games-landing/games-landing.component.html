<!-- ================= EXACT IMAGE STYLE CARDS SECTION ================= -->
<div
  id="games-scroll-id"
  *ngIf="AsianLocalBlock"
  class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5 sm:gap-6 mx-2 sm:mx-4 px-2.5 sm:px-4 py-6 sm:py-8 rounded-[32px] bg-[#292d2e] border border-[#2CD97D]/30 shadow-[0_20px_60px_rgba(0,0,0,0.9)] backdrop-blur-2xl"
  [ngClass]="!isToken ? 'mx-0 2xl:mx-28' : ''"
>
  <ng-container *ngFor="let game of displayedGames">
    <div
      (click)="isMobile() ? OnPlayNow(game) : null"
      class="clean-game-card group"
      [ngStyle]="{ backgroundColor: game.bgclr || '#10b981' }"
    >
      <!-- Top Badges Layer (Bonus & HOT Tags) -->
      <div
        class="absolute top-3 inset-x-3 z-30 flex items-center justify-between pointer-events-none gap-1"
      >
        <div class="flex items-center gap-1">
          <span
            *ngIf="game?.bonus"
            class="bg-black/70 text-amber-300 font-black text-[9px] px-2 py-0.5 rounded shadow uppercase tracking-tighter border border-amber-400/30"
          >
            🔥 {{ game?.bonus }}%
          </span>
          <span
            *ngIf="game.isHot"
            class="bg-orange-500 text-white font-black text-[9px] px-2 py-0.5 rounded shadow uppercase tracking-tighter animate-pulse"
          >
            ⚡ HOT
          </span>
        </div>
      </div>

      <!-- Artwork Display Container -->
      <div class="clean-media-wrap">
        <img [src]="game.image" [alt]="game.name" class="clean-game-artwork" />
      </div>

      <!-- Hover Action Curtain -->
      <div
        class="clean-hover-curtain"
        *ngIf="!isMobile() && game.buttonText != ''"
      >
        <button class="clean-launch-btn" (click)="OnPlayNow(game)">
          <span>{{ isToken ? game.buttonText : "PLAY NOW" }}</span>
          <i class="fas fa-play text-[8px]"></i>
        </button>
      </div>

      <!-- Bottom Centered Game Title (No Download Icon) -->
      <div class="clean-footer-info">
        <h3 class="clean-game-title">
          {{ game.name }}
        </h3>
      </div>
    </div>
  </ng-container>
</div>

<!-- ================= POPUP ================= -->
<div
  *ngIf="AddPlayerModal"
  class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center modal-overlay Add_Bal z-[999] px-4"
  (click)="CloseAddPlayer()"
>
  <div
    class="bg-[#292d2e] border-2 border-[#2CD97D]/40 rounded-3xl w-full max-w-sm modal slide-up shadow-[0_25px_60px_rgba(0,0,0,0.95)] relative overflow-hidden p-5 sm:p-6"
    (click)="$event.stopPropagation()"
  >
    <div
      class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-transparent via-[#2CD97D] to-transparent"
    ></div>

    <div
      class="flex justify-between items-center pb-4 border-b border-[#2CD97D]/20"
    >
      <div class="flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-xl bg-[#2CD97D]/10 border border-[#2CD97D]/30 flex items-center justify-center text-[#2CD97D] text-xs shadow-inner"
        >
          ⚡
        </div>
        <h2 class="text-base font-black text-white uppercase tracking-wider">
          Add <span class="text-[#2CD97D]">Player</span>
        </h2>
      </div>
      <button
        (click)="CloseAddPlayer()"
        class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white flex items-center justify-center transition cursor-pointer border border-white/10"
      >
        <fa-icon [icon]="croswsIcon"></fa-icon>
      </button>
    </div>

    <div class="py-6 text-center flex flex-col items-center">
      <div
        class="w-14 h-14 mb-4 rounded-2xl bg-gradient-to-br from-[#292d2e] to-[#232626] border border-[#2CD97D]/30 flex items-center justify-center shadow-lg"
      >
        <span class="text-2xl">🎮</span>
      </div>
      <p class="text-gray-300 text-xs sm:text-sm font-medium leading-relaxed">
        Ready to join the action? Be the next player in
      </p>
      <div
        class="mt-3 px-4 py-2 rounded-xl bg-black/60 border border-[#2CD97D]/40 shadow-inner w-full"
      >
        <span
          class="text-[#2CD97D] font-black text-sm sm:text-base tracking-wider uppercase drop-shadow"
        >
          {{ gamename }}
        </span>
      </div>
    </div>

    <form
      [formGroup]="scoreForm"
      class="flex flex-col gap-3 justify-center items-center pt-2"
    >
      <button
        type="submit"
        class="w-full py-3.5 rounded-xl bg-[linear-gradient(135deg,#2CD97D_0%,#06B6D4_50%,#FF9F1C_100%)] text-slate-950 font-black uppercase text-xs sm:text-sm tracking-widest shadow-[0_6px_20px_rgba(44,217,125,0.4)] hover:brightness-110 active:scale-95 transition-all duration-200 cursor-pointer border border-white/30"
        (click)="onPlayerSubmit()"
      >
        Add Player
      </button>
    </form>
  </div>
</div>
<!-- ================= END POPUP ================= -->

<!-- Quick Win Casino Section with Border Frame -->
<div
  *ngIf="isDashboardPage || isLandingPage"
  class="mb-10 mt-8 px-3 sm:px-4"
  id="quick-scrolling-id"
>
  <div class="flex items-center ml-1 gap-2 sm:gap-3 mb-4">
    <div
      class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-[#292d2e] to-[#232626] border border-[#2CD97D]/40 flex items-center justify-center shadow-lg shrink-0"
    >
      <img
        src="https://spinhub-6rb.pages.dev/assets/Spin.png"
        alt="Quick Win Casino"
        class="w-4 h-4 sm:w-5 sm:h-5 object-contain scale-150"
      />
    </div>
    <span
      class="text-white font-black text-xs sm:text-base md:text-lg tracking-wider uppercase bg-gradient-to-r from-white via-cyan-200 to-[#2CD97D] bg-clip-text text-transparent drop-shadow-md whitespace-nowrap"
    >
      Quick Win Casino
    </span>
  </div>

  <div
    *ngIf="isToken || isLandingPage"
    class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5 sm:gap-6 mx-auto px-2.5 sm:px-4 py-6 sm:py-8 rounded-[32px] bg-[#292d2e] border border-[#2CD97D]/30 shadow-[0_20px_60px_rgba(0,0,0,0.9)] backdrop-blur-2xl"
    [ngClass]="!isToken ? 'mx-0 2xl:mx-28' : ''"
  >
    <ng-container *ngFor="let game of quickGames">
      <div
        (click)="redirectTo(game.redirectLink)"
        class="clean-game-card group"
        [ngStyle]="{ backgroundColor: game.bgColor || '#10b981' }"
      >
        <div class="clean-media-wrap">
          <img
            [src]="game.image"
            [alt]="game.name"
            class="clean-game-artwork quick-game-artwork"
          />
        </div>

        <div class="clean-hover-curtain" *ngIf="!isMobile()">
          <span class="clean-launch-btn">PLAY NOW</span>
        </div>

        <div class="clean-footer-info">
          <h3 class="clean-game-title">
            {{ game.name }}
          </h3>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<!-- Scratch Cards Section with Border Frame -->
<div *ngIf="isDashboardPage" class="px-3 sm:px-4 mt-8">
  <div class="flex items-center ml-1 gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#292d2e] to-[#232626] border border-[#2CD97D]/40 flex items-center justify-center shadow-lg"
    >
      <img
        src="https://spinhub-6rb.pages.dev/assets/scratch.png"
        alt="Scratch Cards"
        class="w-5 h-5 object-contain scale-150"
      />
    </div>
    <span
      class="text-white font-black text-lg tracking-wider uppercase bg-gradient-to-r from-white via-cyan-200 to-[#2CD97D] bg-clip-text text-transparent drop-shadow-md"
    >
      Scratch Cards
    </span>
  </div>

  <div
    class="rounded-3xl bg-[#292d2e]/60 border border-[#2CD97D]/30 shadow-xl backdrop-blur-sm p-4"
  >
    <app-sectrech-card-list
      id="scratchScrollSection"
      [isHomePage]="router.url == '/' ? true : false"
    >
    </app-sectrech-card-list>

    <div class="flex justify-center mt-6 mb-2 w-full col-span-full">
      <button
        (click)="toggleShowAllScratch()"
        class="px-8 py-2.5 bg-[linear-gradient(135deg,#2CD97D_0%,#06B6D4_50%,#FF9F1C_100%)] text-slate-950 font-black uppercase text-xs sm:text-sm tracking-wider rounded-xl shadow-[0_4px_15px_rgba(44,217,125,0.3)] hover:brightness-110 active:scale-95 transition-all duration-200 cursor-pointer"
      >
        Show All
      </button>
    </div>
  </div>
</div>

<!-- Spin Section with Border Frame -->
<div *ngIf="isDashboardPage || isLandingPage" class="mt-10 px-3 sm:px-4">
  <div class="flex items-center ml-1 gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#292d2e] to-[#232626] border border-[#2CD97D]/40 flex items-center justify-center shadow-lg"
    >
      <img
        src="https://cmaxv2images2.pages.dev/assets/icons/spinner.png"
        alt="Spin"
        class="w-5 h-5 object-contain"
      />
    </div>
    <span
      class="text-white font-black text-lg tracking-wider uppercase bg-gradient-to-r from-white via-cyan-200 to-[#2CD97D] bg-clip-text text-transparent drop-shadow-md"
    >
      Spin
    </span>
  </div>

  <div
    class="rounded-3xl bg-[#292d2e]/60 border border-[#2CD97D]/30 shadow-xl backdrop-blur-sm p-4"
  >
    <app-spinner
      id="spin-scrolling-id"
      [showHeaderSection]="false"
    ></app-spinner>
  </div>
</div>
