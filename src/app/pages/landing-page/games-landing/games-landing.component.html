<!-- Custom Main Tabs with Luxury Design -->
<div
  *ngIf="isToken && isDashboardPage"
  class="flex items-center gap-3 px-4 mb-6"
>
  <button
    (click)="selectedMainTab = 'Games'; onTabChange(displayMainTabs[0])"
    class="px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all duration-200 cursor-pointer shadow"
    [ngClass]="
      selectedMainTab === 'Games'
        ? 'bg-gradient-to-r from-[#FEC866] via-[#FE9B2A] to-[#FE8006] text-black shadow-[0_0_20px_rgba(254,128,6,0.5)] scale-105'
        : 'bg-black/60 text-white border border-white/10 hover:border-[#FE8912]/60'
    "
  >
    Games
  </button>
  <button
    (click)="selectedMainTab = 'Instant Games'; onTabChange(displayMainTabs[1])"
    class="px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all duration-200 cursor-pointer shadow"
    [ngClass]="
      selectedMainTab === 'Instant Games'
        ? 'bg-gradient-to-r from-[#FEC866] via-[#FE9B2A] to-[#FE8006] text-black shadow-[0_0_20px_rgba(254,128,6,0.5)] scale-105'
        : 'bg-black/60 text-white border border-white/10 hover:border-[#FE8912]/60'
    "
  >
    Instant
  </button>
</div>

<!-- Elite Games Title & Search Box in One Single Row -->
<div
  *ngIf="isToken && isDashboardPage && AsianLocalBlock"
  class="flex flex-row items-center justify-between gap-2 w-full px-4 mb-4"
>
  <div class="flex items-center gap-2 shrink-0">
    <div
      class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-[#2a2d35] to-[#121417] border border-[#C3B089]/40 flex items-center justify-center shadow-lg shrink-0"
    >
      <img
        src="https://cmaxnewimages.pages.dev/assets/extra/dashboradGame.png"
        alt="Elite Games"
        class="w-4 h-4 sm:w-5 sm:h-5 object-contain"
      />
    </div>
    <span
      class="text-white font-black text-xs sm:text-base md:text-lg tracking-wider uppercase bg-gradient-to-r from-white via-amber-100 to-amber-500 bg-clip-text text-transparent drop-shadow-md whitespace-nowrap"
    >
      Elite Games
    </span>
  </div>

  <div class="flex items-center w-[150px] sm:w-[220px] md:max-w-xs shrink-0">
    <div class="relative w-full">
      <input
        type="text"
        placeholder="Search games..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
        class="w-full bg-[#16181b]/90 backdrop-blur-md text-white border border-[#C3B089]/40 text-xs sm:text-sm rounded-2xl py-2 px-3 pl-8 focus:outline-none focus:border-[#FE8912] focus:ring-2 focus:ring-[#FE8912]/30 transition shadow-inner placeholder-gray-500"
      />
      <svg
        class="w-3.5 h-3.5 text-amber-400 absolute left-2.5 top-1/2 transform -translate-y-1/2"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </div>
  </div>
</div>

<!-- Panel Games Section with Border Frame -->
<div
  id="games-scroll-id"
  *ngIf="isToken && isDashboardPage && AsianLocalBlock"
  class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-3 sm:gap-6 mx-3 sm:mx-4 text-center px-3 sm:px-4 py-4 rounded-3xl bg-[#0e1117]/60 border border-[#C3B089]/25 shadow-xl backdrop-blur-sm"
  [ngClass]="!isToken ? 'mx-0 2xl:mx-28' : ''"
>
  <ng-container *ngFor="let game of displayedGames">
    <div
      (click)="isMobile() ? OnPlayNow(game) : null"
      class="dash-game-card group"
      [style.--card-glow]="game.bgclr || '#FE8912'"
    >
      <!-- Cover Image -->
      <img [src]="game.image" [alt]="game.name" class="game-image" />

      <!-- Fixed Responsive Top Badges Area -->
      <div
        class="absolute top-2 inset-x-2 z-30 flex items-center justify-between pointer-events-none gap-1"
      >
        <span
          *ngIf="game?.bonus"
          class="bg-gradient-to-r from-[#ffe135] via-[#ffb700] to-[#ff8c00] text-black font-extrabold text-[6px] sm:text-[8px] px-1.5 py-0.5 rounded shadow-sm uppercase tracking-tighter flex items-center gap-0.5 border border-white/40 shrink-0"
        >
          <span>🔥</span> {{ game?.bonus }}%
        </span>
        <span *ngIf="!game?.bonus"></span>
        <span
          *ngIf="game.isHot"
          class="bg-gradient-to-r from-red-600 via-rose-500 to-orange-500 text-white font-extrabold text-[6px] sm:text-[8px] px-1.5 py-0.5 rounded shadow-sm uppercase tracking-tighter flex items-center gap-0.5 border border-white/40 shrink-0 ml-auto"
        >
          <span>⚡</span> HOT
        </span>
      </div>

      <!-- Hover Play Overlay -->
      <div class="play-overlay" *ngIf="!isMobile() && game.buttonText != ''">
        <button class="play-btn" (click)="OnPlayNow(game)">
          {{ isToken ? game.buttonText : "Play Now" }}
        </button>
      </div>

      <!-- Floating Glass Footer Pill -->
      <div class="card-footer-pill">
        <span class="game-title" [ngStyle]="{ color: game.bgclr || '#FFD700' }">
          {{ game.name }}
        </span>
        <a
          [ngStyle]="{ color: game.bgclr || '#FFD700' }"
          [href]="game.downloadLink"
          target="_blank"
          (click)="$event.stopPropagation()"
          class="download-icon-btn"
        >
          <i class="fas fa-download text-[8px] sm:text-[10px]"></i>
        </a>
      </div>
    </div>
  </ng-container>
</div>

<!-- ================= PERFECTED LUXURY CASINO POPUP ================= -->
<div
  *ngIf="AddPlayerModal"
  class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center modal-overlay Add_Bal z-[999] px-4"
  (click)="CloseAddPlayer()"
>
  <div
    class="bg-[#121418] border-2 border-[#C3B089]/40 rounded-3xl w-full max-w-sm modal slide-up shadow-[0_25px_60px_rgba(0,0,0,0.95)] relative overflow-hidden p-5 sm:p-6"
    (click)="$event.stopPropagation()"
  >
    <div
      class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-transparent via-[#FE9B2A] to-transparent"
    ></div>

    <div
      class="flex justify-between items-center pb-4 border-b border-[#C3B089]/20"
    >
      <div class="flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-xs shadow-inner"
        >
          ⚡
        </div>
        <h2 class="text-base font-black text-white uppercase tracking-wider">
          Add <span class="text-[#FE9B2A]">Player</span>
        </h2>
      </div>
      <button
        (click)="CloseAddPlayer()"
        class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white flex items-center justify-center transition cursor-pointer border border-white/10"
      >
        <fa-icon [icon]="croswsIcon"></fa-icon>
      </button>
    </div>

    <div class="py-6 text-center flex flex-col items-center">
      <div
        class="w-14 h-14 mb-4 rounded-2xl bg-gradient-to-br from-[#221c10] to-[#121417] border border-[#C3B089]/30 flex items-center justify-center shadow-lg"
      >
        <span class="text-2xl">🎮</span>
      </div>
      <p class="text-gray-300 text-xs sm:text-sm font-medium leading-relaxed">
        Ready to join the action? Be the next player in
      </p>
      <div
        class="mt-3 px-4 py-2 rounded-xl bg-black/60 border border-[#FE9B2A]/40 shadow-inner w-full"
      >
        <span
          class="text-[#FE9B2A] font-black text-sm sm:text-base tracking-wider uppercase drop-shadow"
        >
          {{ gamename }}
        </span>
      </div>
    </div>

    <form
      [formGroup]="scoreForm"
      class="flex flex-col gap-3 justify-center items-center pt-2"
    >
      <button
        type="submit"
        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#FEC866] via-[#FE9B2A] to-[#FE8006] text-black font-black uppercase text-xs sm:text-sm tracking-widest shadow-[0_6px_20px_rgba(254,128,6,0.4)] hover:brightness-110 active:scale-95 transition-all duration-200 cursor-pointer border border-white/30"
        (click)="onPlayerSubmit()"
      >
        Add Player
      </button>
    </form>
  </div>
</div>
<!-- ================= END POPUP ================= -->

<!-- Quick Win Casino Section with Border Frame -->
<div
  *ngIf="isDashboardPage"
  class="mb-10 mt-8 px-3 sm:px-4"
  id="quick-scrolling-id"
>
  <div class="flex items-center ml-1 gap-2 sm:gap-3 mb-4">
    <div
      class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-[#2a2d35] to-[#121417] border border-[#C3B089]/40 flex items-center justify-center shadow-lg shrink-0"
    >
      <img
        src="https://cmaxv2images2.pages.dev/assets/icons/spinner.png"
        alt="Quick Win Casino"
        class="w-4 h-4 sm:w-5 sm:h-5 object-contain"
      />
    </div>
    <span
      class="text-white font-black text-xs sm:text-base md:text-lg tracking-wider uppercase bg-gradient-to-r from-white via-amber-100 to-amber-500 bg-clip-text text-transparent drop-shadow-md whitespace-nowrap"
    >
      Quick Win Casino
    </span>
  </div>

  <div
    *ngIf="isToken && isDashboardPage"
    class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-3 sm:gap-6 mx-auto text-center px-3 sm:px-4 py-4 rounded-3xl bg-[#0e1117]/60 border border-[#C3B089]/25 shadow-xl backdrop-blur-sm"
    [ngClass]="!isToken ? 'mx-0 2xl:mx-28' : ''"
  >
    <ng-container *ngFor="let game of quickGames">
      <div
        (click)="redirectTo(game.redirectLink)"
        class="dash-game-card group"
        [style.--card-glow]="game.bgColor || '#FE8912'"
      >
        <img [src]="game.image" [alt]="game.name" class="game-image" />

        <div class="play-overlay" *ngIf="!isMobile()">
          <span class="play-btn">Play Now</span>
        </div>

        <div class="card-footer-pill">
          <span
            class="game-title"
            [ngStyle]="{ color: game.bgColor || '#FFD700' }"
          >
            {{ game.name }}
          </span>
          <a
            [ngStyle]="{ color: game.bgColor || '#FFD700' }"
            [routerLink]="game.downloadLink"
            target="_blank"
            (click)="$event.stopPropagation()"
            class="download-icon-btn"
          >
            <i class="fas fa-download text-[8px] sm:text-[10px]"></i>
          </a>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<div>
  <app-cmax-games
    *ngIf="!isDashboardPage"
    id="gameScrollSection"
  ></app-cmax-games>
  <app-on-boarding-steps
    *ngIf="!isDashboardPage"
    id="howItWorksScrollSection"
  ></app-on-boarding-steps>
  <app-spin *ngIf="!isDashboardPage" id="spinnerScrollSection"></app-spin>
  <app-about-us *ngIf="!isDashboardPage" id="aboutScrollSection"></app-about-us>
</div>

<!-- Scratch Cards Section with Border Frame -->
<div *ngIf="isDashboardPage" class="px-3 sm:px-4 mt-8">
  <div class="flex items-center ml-1 gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#2a2d35] to-[#121417] border border-[#C3B089]/40 flex items-center justify-center shadow-lg"
    >
      <img
        src="https://cmaxv2images2.pages.dev/assets/icons/scratch.png"
        alt="Scratch Cards"
        class="w-5 h-5 object-contain"
      />
    </div>
    <span
      class="text-white font-black text-lg tracking-wider uppercase bg-gradient-to-r from-white via-amber-100 to-amber-500 bg-clip-text text-transparent drop-shadow-md"
    >
      Scratch Cards
    </span>
  </div>

  <div
    class="rounded-3xl bg-[#0e1117]/60 border border-[#C3B089]/25 shadow-xl backdrop-blur-sm p-4"
  >
    <app-sectrech-card-list
      id="scratchScrollSection"
      [isHomePage]="router.url == '/' ? true : false"
    >
    </app-sectrech-card-list>

    <div class="flex justify-center mt-6 mb-2 w-full col-span-full">
      <button
        (click)="toggleShowAllScratch()"
        class="px-8 py-2.5 bg-gradient-to-r from-[#FEC866] via-[#FE9B2A] to-[#FE8006] text-black font-black uppercase text-xs sm:text-sm tracking-wider rounded-xl shadow-[0_4px_15px_rgba(254,128,6,0.3)] hover:brightness-110 active:scale-95 transition-all duration-200 cursor-pointer"
      >
        Show All
      </button>
    </div>
  </div>
</div>

<!-- Spin Section with Border Frame -->
<div *ngIf="isDashboardPage" class="mt-10 px-3 sm:px-4">
  <div class="flex items-center ml-1 gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#2a2d35] to-[#121417] border border-[#C3B089]/40 flex items-center justify-center shadow-lg"
    >
      <img
        src="https://cmaxv2images2.pages.dev/assets/icons/spinner.png"
        alt="Spin"
        class="w-5 h-5 object-contain"
      />
    </div>
    <span
      class="text-white font-black text-lg tracking-wider uppercase bg-gradient-to-r from-white via-amber-100 to-amber-500 bg-clip-text text-transparent drop-shadow-md"
    >
      Spin
    </span>
  </div>

  <div
    class="rounded-3xl bg-[#0e1117]/60 border border-[#C3B089]/25 shadow-xl backdrop-blur-sm p-4"
  >
    <app-spinner
      id="spin-scrolling-id"
      *ngIf="!isLandingPage"
      [showHeaderSection]="false"
    ></app-spinner>
  </div>
</div>
