<!-- Tab Navigation Component -->
<app-tab-navigation *ngIf="isToken && isDashboardPage" [activeTab]="selectedMainTab" [tabs]="displayMainTabs"
  (tabChange)="onTabChange($event)">
</app-tab-navigation>

<div *ngIf="isToken && isDashboardPage && AsianLocalBlock" class="flex justify-between items-center w-full px-4">
  <!-- LEFT: Logo -->
  <div class="flex items-center">
    <img src="https://cmaxnewimages.pages.dev/assets/extra/dashboradGame.png" alt="Games"
      class="w-8 h-8 object-contain" />
    <span class="ml-3 text-white font-bold text-md leading-none mt-4">
      Games
    </span>
  </div>

  <!-- RIGHT: Search -->
  <div class="flex w-[50%] sm:w-full max-w-xs">
    <div class="relative flex-1">
      <input type="text" placeholder="Search..." [(ngModel)]="searchTerm" (input)="onSearch()"
        class="w-full bg-transparent text-white border border-[#aa9a78] text-sm rounded-tl-xl rounded-br-xl py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-[#aa9a78]" />

      <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
  </div>
</div>

<!-- Panel Games Section -->

<div id="games-scroll-id" *ngIf="isToken && isDashboardPage && AsianLocalBlock"
  class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 3xl:grid-cols-9 gap-2 sm:gap-3 lg:gap-1 2xl:gap-1 mx-auto text-center md:px-1 px-4 py-2 sm:pb-4"
  [ngClass]="!isToken ? 'mx-0 2xl:mx-28' : ''">
  <ng-container *ngFor="let game of displayedGames">
    <div (click)="isMobile() ? OnPlayNow(game) : null"
      class="dash-game-card group mt-2 relative w-30 h-40 sm:w-32 sm:h-44 md:w-36 md:h-50 cursor-pointer rounded-2xl overflow-hidden transition-all duration-500 hover:-translate-y-1"
      [ngStyle]="{ 'box-shadow': '0 10px 24px rgba(0,0,0,0.55), 0 0 0 1px ' + (game.bgclr || '#FE8912') + '66' }">

      <!-- Cover image (full-bleed) -->
      <img [src]="game.image" [alt]="game.name"
        class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />

      <!-- Bottom gradient scrim for legible text -->
      <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black via-black/55 to-transparent pointer-events-none"></div>

      <!-- Glowing accent border ring (per-game color) -->
      <div class="absolute inset-0 rounded-2xl pointer-events-none transition-colors duration-300"
        [ngStyle]="{ border: '1.5px solid ' + (game.bgclr || '#FE8912') + '90' }"></div>

      <div class="absolute inset-0 z-10">
        <!-- BONUS TAG -->
        <span *ngIf="game?.bonus"
          class="absolute top-1.5 left-1.5 sm:top-2 sm:left-2 flex items-center justify-center bg-gradient-to-b from-[#f3c87a] to-[#ba8b42] rounded-full px-1.5 sm:px-2 py-0.5 text-black font-bold text-center shadow-lg">
          <span class="text-[8px] sm:text-[10px] font-bold leading-[1]">{{ game?.bonus }}%</span>
        </span>

        <!-- HOT Ribbon -->
        <span *ngIf="game.isHot" class="absolute top-0 right-0 w-14 h-14 overflow-hidden">
          <span
            class="absolute top-1 right-[-20px] rotate-45 bg-gradient-to-r from-orange-500 to-red-600 text-white text-[7px] sm:text-[8px] font-bold px-5 sm:px-6 py-0.5 sm:py-1 shadow-md tracking-wide">
            HOT
          </span>
        </span>

        <!-- Name + download -->
        <div
          class="absolute bottom-1.5 sm:bottom-2 inset-x-0 flex items-center justify-center gap-1 sm:gap-1.5 px-1.5">
          <span class="text-[8px] sm:text-[10px] font-bold truncate" [ngStyle]="{ color: game.bgclr || '#FFD700' }">{{
            game.name }}</span>
          <a [ngStyle]="{ color: game.bgclr || '#FFD700' }" [href]="game.downloadLink" target="_blank"
            (click)="$event.stopPropagation()" class="hover:text-white transition-colors duration-200 flex-shrink-0">
            <i class="fas fa-download text-[8px] sm:text-[10px]"></i>
          </a>
        </div>
      </div>

      <!-- Play Button - Hover Overlay -->
      <div
        class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20"
        *ngIf="!isMobile() && game.buttonText != ''">
        <button
          class="bg-gradient-to-b from-[#FEC866] to-[#FE8006] text-black font-bold text-[10px] sm:text-xs md:text-sm py-1 px-3 sm:px-4 rounded-full shadow-md hover:scale-105 transition"
          (click)="OnPlayNow(game)">
          {{ isToken ? game.buttonText : "Play Now" }}
        </button>
      </div>
    </div>
  </ng-container>
</div>

<!-- Load more button -->

<div *ngIf="hasMoreGames && isToken && isDashboardPage && AsianLocalBlock" class="col-span-full flex justify-end">
  <button
    class="mt-3 bg-gradient-to-b from-[#FEC866] to-[#FE8006] text-gray-800 font-semibold text-sm sm:text-base py-1 px-3 sm:px-3 rounded-br-xl rounded-tl-xl hover:bg-white transition"
    (click)="toggleShowAll()">
    {{ showAllGames ? "See Less" : "See All" }}
  </button>
</div>

<div *ngIf="AddPlayerModal"
  class="fixed inset-0 bg-black/80 flex items-center justify-center modal-overlay Add_Bal z-[999]"
  (click)="CloseAddPlayer()">
  <div
    class="bg-noise border border-[#C3B089] rounded-tl-[16px] rounded-tr-[3px] rounded-br-[16px] rounded-bl-[3px] w-full max-w-md modal slide-up"
    (click)="$event.stopPropagation()">
    <div class="flex justify-between border-b border-[#C3B089] rounded-tl-[16px] items-center mb-10 px-6 py-3">
      <h2 class="text-xl font-bold text-[#FEA234]">Add Player</h2>
      <button (click)="CloseAddPlayer()" class="text-white">
        <i class="bi bi-x"></i>
        <fa-icon [icon]="croswsIcon" class="hover:text-gray-400"></fa-icon>
      </button>
    </div>
    <p class="text-center text-gray-300 p-6 mb-6 text-lg font-medium">
      Ready to join the action? Be the next player in
      <span class="text-[#ffb24a] font-bold">{{ gamename }} </span>!
    </p>
    <form [formGroup]="scoreForm" class="flex flex-col gap-4 justify-center items-center">
      <button type="submit" class="btn-primary mb-4" (click)="onPlayerSubmit()">
        Add Player
      </button>
    </form>
  </div>
</div>

<!-- Instant Games Section -->

<div *ngIf="isDashboardPage" class="mb-10" id="quick-scrolling-id">
  <div class="flex items-center ml-4">
    <img src="https://cmaxv2images2.pages.dev/assets/icons/spinner.png" alt="Instant Games"
      class="w-8 h-8 object-contain" />
    <span class="ml-3 text-white font-bold text-md leading-none mt-4">
      Instant Games
    </span>
  </div>
  <app-tab-navigation *ngIf="isToken && isDashboardPage" [activeTab]="QuickgameTab[0].value" [tabs]="QuickgameTab"
    (tabChange)="onTabChange($event)">
  </app-tab-navigation>
  <div *ngIf="isToken && isDashboardPage"
    class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 3xl:grid-cols-9 gap-2 sm:gap-3 lg:gap-1 2xl:gap-1 mx-auto text-center md:px-1 px-4 py-2 sm:pb-4"
    [ngClass]="!isToken ? 'mx-0 2xl:mx-28' : ''">
    <ng-container *ngFor="let game of quickGames">
      <div (click)="redirectTo(game.redirectLink)"
        class="dash-game-card group mt-2 relative w-30 h-40 sm:w-32 sm:h-44 md:w-36 md:h-50 cursor-pointer rounded-2xl overflow-hidden transition-all duration-500 hover:-translate-y-1"
        [ngStyle]="{ 'box-shadow': '0 10px 24px rgba(0,0,0,0.55), 0 0 0 1px ' + (game.bgColor || '#FE8912') + '66' }">

        <!-- Cover image (full-bleed) -->
        <img [src]="game.image" [alt]="game.name"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />

        <!-- Bottom gradient scrim for legible text -->
        <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black via-black/55 to-transparent pointer-events-none"></div>

        <!-- Glowing accent border ring (per-game color) -->
        <div class="absolute inset-0 rounded-2xl pointer-events-none transition-colors duration-300"
          [ngStyle]="{ border: '1.5px solid ' + (game.bgColor || '#FE8912') + '90' }"></div>

        <!-- Name + download -->
        <div class="absolute bottom-1.5 sm:bottom-2 inset-x-0 flex items-center justify-center gap-1 sm:gap-1.5 px-1.5 z-10">
          <span class="text-[8px] sm:text-[10px] font-bold truncate"
            [ngStyle]="{ color: game.bgColor || '#FFD700' }">{{ game.name }}</span>
          <a [ngStyle]="{ color: game.bgColor || '#FFD700' }" [routerLink]="game.downloadLink" target="_blank"
            (click)="$event.stopPropagation()" class="hover:text-white transition-colors duration-200 flex-shrink-0">
            <i class="fas fa-download text-[8px] sm:text-[10px]"></i>
          </a>
        </div>

        <!-- Play hint on hover (whole card is already clickable) -->
        <div
          class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 pointer-events-none">
          <span
            class="bg-gradient-to-b from-[#FEC866] to-[#FE8006] text-black font-bold text-[10px] sm:text-xs py-1 px-3 sm:px-4 rounded-full shadow-md">
            Play Now
          </span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
