<div
  class="w-full text-white font-sans py-16 lg:py-24 px-4 sm:px-8 lg:px-20 relative overflow-hidden bg-[#232626]"
>
  <!-- Background Emerald Glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[650px] h-[650px] bg-[#2CD97D]/12 blur-[170px] rounded-full pointer-events-none"></div>

  <!-- Header -->
  <div class="text-center mb-14 max-w-2xl mx-auto">
    <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#292d2e] border border-[#2CD97D]/40 text-[#2CD97D] text-[10px] sm:text-xs font-mono font-bold tracking-widest uppercase shadow-[0_0_15px_rgba(44,217,125,0.2)] mb-3">
      <span class="w-2 h-2 rounded-full bg-[#2CD97D] animate-ping"></span>
      <span>VERIFIED PLAYER TESTIMONIALS</span>
    </div>
    <h2 class="text-white font-black text-[28px] sm:text-[38px] md:text-[44px] leading-tight uppercase">
      What Our Champions <br />
      <span class="bg-gradient-to-r from-[#2CD97D] via-[#4EFAAA] to-white bg-clip-text text-transparent drop-shadow">Say About Us</span>
    </h2>
  </div>

  <!-- Feedback Cards Carousel -->
  <div
    class="relative z-10 w-full max-w-4xl mx-auto overflow-hidden"
    (mouseenter)="stopAutoplay()"
    (mouseleave)="startAutoplay()"
  >
    <div
      class="flex transition-transform duration-500 ease-out"
      [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
    >
      <div
        *ngFor="let item of feedbacks"
        class="flex-shrink-0 w-full flex justify-center px-2"
      >
        <!-- Card Content -->
        <div
          class="w-full max-w-[680px] relative z-10 bg-[#292d2e] border-2 border-[#2CD97D]/35 rounded-[32px] p-7 sm:p-9 shadow-[0_30px_70px_rgba(0,0,0,0.95)] flex flex-col justify-between backdrop-blur-2xl"
        >
          <!-- Corner Tech Accents -->
          <span class="absolute top-0 left-0 w-7 h-7 border-t-2 border-l-2 border-[#2CD97D] rounded-tl-[32px]"></span>
          <span class="absolute top-0 right-0 w-7 h-7 border-t-2 border-r-2 border-[#2CD97D] rounded-tr-[32px]"></span>
          <span class="absolute bottom-0 left-0 w-7 h-7 border-b-2 border-l-2 border-[#2CD97D] rounded-bl-[32px]"></span>
          <span class="absolute bottom-0 right-0 w-7 h-7 border-b-2 border-r-2 border-[#2CD97D] rounded-br-[32px]"></span>

          <!-- Header Layer -->
          <div class="flex items-center justify-between border-b border-[#2CD97D]/20 pb-5 mb-5">
            <!-- User Info -->
            <div class="flex items-center gap-3.5">
              <div class="w-13 h-13 rounded-2xl bg-[#232626] border-2 border-[#2CD97D]/50 flex items-center justify-center overflow-hidden shadow-inner p-0.5">
                <img
                  *ngIf="item.img"
                  [src]="item.img"
                  alt="avatar"
                  class="w-full h-full object-cover rounded-xl"
                />
                <span *ngIf="!item.img" class="text-xl">👤</span>
              </div>
              <div>
                <h5 class="font-black text-white text-base sm:text-lg uppercase tracking-wide">
                  {{ item.name }}
                </h5>
                <p class="text-[#2CD97D] font-mono text-xs font-bold">
                  {{ item.role }}
                </p>
              </div>
            </div>

            <!-- 5-Star Emerald Rating -->
            <div class="flex items-center gap-1 text-[#2CD97D] text-sm">
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
            </div>
          </div>

          <!-- Feedback Text -->
          <p class="text-slate-200 text-sm sm:text-base leading-relaxed font-medium">
            "{{ item.text }}"
          </p>

          <!-- Verified Footer Chip -->
          <div class="mt-6 pt-4 border-t border-white/10 flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono">
            <span class="text-[#2CD97D] font-black flex items-center gap-1.5">
              <i class="fas fa-circle-check"></i>
              <span>VERIFIED CASINO WINNER</span>
            </span>
            <span class="px-2.5 py-1 rounded-full bg-[#232626] border border-[#2CD97D]/40 text-[#2CD97D] font-bold">
              INSTANT PAYOUT CONFIRMED
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Slider Navigation -->
  <div class="flex items-center justify-center gap-6 mt-10 relative z-20">
    <button
      (click)="previousSlide()"
      class="w-11 h-11 rounded-2xl bg-[#292d2e] border border-[#2CD97D]/40 text-[#2CD97D] flex items-center justify-center hover:bg-[#2CD97D] hover:text-[#050811] active:scale-95 transition cursor-pointer shadow-lg"
    >
      <i class="fas fa-chevron-left text-sm"></i>
    </button>

    <div class="flex items-center gap-2">
      <button
        *ngFor="let dot of getDots(); let i = index"
        (click)="goToSlide(i)"
        class="h-2.5 rounded-full transition-all duration-300 cursor-pointer"
        [ngClass]="i === currentSlide ? 'w-8 bg-[#2CD97D] shadow-[0_0_12px_rgba(44,217,125,0.7)]' : 'w-2.5 bg-white/20 hover:bg-white/40'"
      ></button>
    </div>

    <button
      (click)="nextSlide()"
      class="w-11 h-11 rounded-2xl bg-[#292d2e] border border-[#2CD97D]/40 text-[#2CD97D] flex items-center justify-center hover:bg-[#2CD97D] hover:text-[#050811] active:scale-95 transition cursor-pointer shadow-lg"
    >
      <i class="fas fa-chevron-right text-sm"></i>
    </button>
  </div>
</div>
