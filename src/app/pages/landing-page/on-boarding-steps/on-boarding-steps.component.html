<div class="bg-black text-white py-16 lg:py-24 px-6 md:px-12 lg:px-20">
  <div class="max-w-5xl mx-auto text-center">
    <span
      class="inline-block text-[#FE8912] font-bold tracking-[0.3em] text-[10px] sm:text-xs uppercase mb-3"
    >
      Getting Started
    </span>
    <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold">How It Works</h1>
    <p class="text-gray-400 mt-3 text-sm md:text-base max-w-2xl mx-auto">
      Sign up now to unlock exclusive bonuses, play thrilling games, and
      compete for big rewards your journey to nonstop entertainment starts
      here.
    </p>
  </div>

  <div class="relative mt-16 lg:mt-20 max-w-6xl mx-auto">
    <!-- Connecting line (desktop only) -->
    <div
      class="hidden lg:block absolute top-[3.5rem] left-[12%] right-[12%] h-[2px] bg-gradient-to-r from-transparent via-[#FE8912]/40 to-transparent"
    ></div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-y-12 gap-x-6">
      <div
        *ngFor="let step of steps"
        class="relative flex flex-col items-center text-center cursor-pointer group"
        (click)="redirectToSignUp()"
      >
        <div class="relative w-[7rem] h-[7rem] flex items-center justify-center mb-5">
          <div
            class="absolute inset-0 rounded-2xl bg-gradient-to-b from-[#161819] to-[#000000] border border-[#8A7960]/30 shadow-[0px_4px_30px_0px_#FE89121F] transition-all duration-300 group-hover:-translate-y-1 group-hover:border-[#FE8912]/70 group-hover:shadow-[0px_4px_30px_0px_#FE89124D]"
          ></div>
          <span class="relative z-10 font-bold text-3xl text-[#FE9B2A]">{{
            step.number
          }}</span>
        </div>
        <h3 class="font-semibold text-lg text-white mb-1">{{ step.title }}</h3>
        <p class="text-gray-400 text-sm leading-snug max-w-[15rem]">
          {{ step.description }}
        </p>
      </div>
    </div>
  </div>
</div>
