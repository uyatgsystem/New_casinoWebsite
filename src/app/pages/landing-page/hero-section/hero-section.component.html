<div class="relative bg-[#000408] text-center px-6 overflow-hidden">

  <!-- RIGHT SIDE BACKGROUND IMAGE -->
  <img src="https://cmaxnewimages.pages.dev/assets/extra/shape.png" alt="casino" class="absolute
         left-1/2  -translate-x-1/2 -translate-y-1/2
         lg:left-auto lg:right-6 lg:translate-x-0    max-h-[180px] sm:max-h-[220px] lg:max-h-[350px]
         opacity-50 sm:opacity-30 lg:opacity-100
         pointer-events-none z-0 animate-float" />

  <!-- CONTENT (PERFECT CENTER) -->
  <div class="relative z-10 flex flex-col items-center justify-center min-h-[35vh] lg:min-h-[50vh]">
    <h2 class="text-white text-3xl md:text-4xl lg:text-5xl font-extrabold mb-4">
      Ready to <span class="text-[#FE8912]">Spin?</span>
    </h2>
    <p class="text-[#A6B1C2] text-sm md:text-base max-w-md mb-8">
      Join Spin Club and discover an exciting gaming experience.
    </p>

    <div class="flex flex-col sm:flex-row items-center gap-4">
      <button (click)="RedirectToLogin()" type="button" class="text-black font-semibold px-14 py-[0.65rem] shadow-md
        rounded-full
        bg-gradient-to-b from-[#FEC866] to-[#FE8006] transition hover:scale-105 hover:shadow-lg">
        Play Now
      </button>
      <button (click)="RedirectToSignUp()" type="button" class="text-white font-semibold px-10 py-[0.6rem]
        rounded-full bg-black
        border border-[#8A7960]/50 transition hover:scale-105 hover:border-[#FE8912] hover:text-[#FE9B2A]">
        Join Now
      </button>
    </div>
  </div>
</div>
