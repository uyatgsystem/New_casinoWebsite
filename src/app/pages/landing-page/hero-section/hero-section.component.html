<section class="cta-band relative overflow-hidden">
  <!-- Ambient cyber emerald glow -->
  <div class="cta-glow cta-glow--one"></div>
  <div class="cta-glow cta-glow--two"></div>
  <div class="cta-grid-overlay"></div>

  <div class="relative z-10 max-w-6xl mx-auto px-6 sm:px-10 py-20 lg:py-28">
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_auto] items-center gap-12">
      <div class="text-center lg:text-left">
        <span class="cta-eyebrow">Your Table Is Waiting</span>
        <h2 class="text-[#F5F5F7] text-3xl sm:text-4xl lg:text-5xl font-extrabold mb-4 tracking-tight leading-[1.05]">
          Ready to <span class="text-[#22C55E]">Spin?</span>
        </h2>
        <p class="text-[#93A69C] text-sm md:text-base max-w-md mx-auto lg:mx-0 mb-8">
          Join Spin Hub and discover an exciting gaming experience built for
          players who expect more.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4">
          <button (click)="RedirectToLogin()" type="button" class="cta-btn-primary">
            <i class="fas fa-play text-xs"></i> Play Now
          </button>
          <button (click)="RedirectToSignUp()" type="button" class="cta-btn-outline">
            Join Now
          </button>
        </div>
      </div>

      <div class="cta-orb hidden lg:flex">
        <img
          src="https://cmaxnewimages.pages.dev/assets/extra/shape.png"
          alt="casino"
          class="w-full h-full object-contain animate-float"
        />
      </div>
    </div>
  </div>
</section>
