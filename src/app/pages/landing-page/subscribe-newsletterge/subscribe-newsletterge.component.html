<app-loader></app-loader>
<div
  class="flex flex-col items-center justify-center p-12 text-white rounded-2xl bg-[#0C101D] border border-[#00F5D4]/30 shadow-[0_0_30px_rgba(0,245,212,0.15)]"
>
  <div
    class="flex flex-col md:flex-row items-center justify-between w-full max-w-4xl"
  >
    <div class="w-full md:w-1/2 mb-8 md:mb-0 text-center md:text-left">
      <h2
        class="text-2xl font-black mb-3 text-transparent bg-clip-text bg-gradient-to-r from-[#00F5D4] via-[#06B6D4] to-[#FF9F1C]"
      >
        Stay Updated with Our Latest News!
      </h2>
      <p class="text-sm text-slate-300 font-medium">
        Subscribe to our newsletter and never miss an update. Get the latest
        news, tips, and exclusive offers delivered straight to your inbox.
      </p>
    </div>
    <div class="w-full md:w-1/2 flex flex-col items-center">
      <div class="flex flex-col items-center justify-center w-full">
        <form
          [formGroup]="newsletterForm"
          (ngSubmit)="onSubmit()"
          class="flex flex-col md:flex-row gap-3 justify-center items-center w-full"
        >
          <input
            class="w-full md:w-auto p-3 rounded-xl md:rounded-l-xl bg-[#050811] border border-[#00F5D4]/40 text-white placeholder-slate-500 focus:outline-none focus:border-[#00F5D4] text-sm"
            type="email"
            formControlName="email"
            placeholder="Enter your email address"
          />
          <button
            class="w-full md:w-auto px-6 py-3 rounded-xl md:rounded-r-xl bg-gradient-to-r from-[#00F5D4] via-[#06B6D4] to-[#FF9F1C] text-[#050811] font-extrabold text-xs uppercase tracking-wider hover:brightness-110 transition duration-300 shadow-md"
            type="submit"
            [disabled]="newsletterForm.invalid"
            [ngClass]="{
              'cursor-not-allowed opacity-50': newsletterForm.invalid,
              'cursor-pointer': !newsletterForm.invalid,
            }"
          >
            Send
          </button>
        </form>
        <div class="min-h-[1.5rem]">
          <div
            *ngIf="
              newsletterForm.controls['email'].invalid &&
              newsletterForm.controls['email'].touched
            "
            class="text-red-400 text-xs mt-2 font-medium"
          >
            <p *ngIf="newsletterForm.controls['email'].errors?.['required']">
              Email is required.
            </p>
            <p *ngIf="newsletterForm.controls['email'].errors?.['email']">
              Invalid email format.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
